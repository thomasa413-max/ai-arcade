let az=0,polar=.72,dist=16,targetAz=0,targetPolar=.72,targetDist=16;function updateCamera(){az+=(targetAz-az)*.13;polar+=(targetPolar-polar)*.13;dist+=(targetDist-dist)*.13;camera.position.set(Math.sin(az)*Math.cos(polar)*dist,Math.sin(polar)*dist,Math.cos(az)*Math.cos(polar)*dist);camera.lookAt(0,0,0)}function resetView(){targetAz=0;targetPolar=.9;targetDist=16;resize()}function resize(){let w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.fov=w<h?45:38;camera.updateProjectionMatrix();renderer.setSize(w,h);let fit=w<h?Math.max(15,17*(h/w)*.72):15;targetDist=Math.max(targetDist,fit);targetDist=Math.min(targetDist,26)}addEventListener('resize',resize);resize();resetView();const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function squareAt(x,y){let rect=renderer.domElement.getBoundingClientRect();mouse.set((x-rect.left)/rect.width*2-1,-(y-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects(tiles,false);return hits.length?hits[0].object.userData.square:-1}
let touches=new Map(),gesture=null;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,px:e.clientX,py:e.clientY,t:performance.now(),moved:false});if(touches.size===2){let a=[...touches.values()];gesture=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}},{passive:true});renderer.domElement.addEventListener('pointermove',e=>{let t=touches.get(e.pointerId);if(!t)return;let dx=e.clientX-t.px,dy=e.clientY-t.py;t.x=e.clientX;t.y=e.clientY;t.px=e.clientX;t.py=e.clientY;if(Math.hypot(e.clientX-t.sx,e.clientY-t.sy)>8)t.moved=true;if(touches.size>=2){let a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(gesture)targetDist=THREE.MathUtils.clamp(targetDist*gesture/Math.max(d,1),11,27);gesture=d}else if(Math.abs(dx)+Math.abs(dy)>0&&t.moved){targetAz-=dx*.009;targetPolar=THREE.MathUtils.clamp(targetPolar+dy*.007,.38,1.45)}});renderer.domElement.addEventListener('pointerup',e=>{let t=touches.get(e.pointerId);if(t&&!t.moved&&touches.size===1&&performance.now()-t.t<450)tap(squareAt(e.clientX,e.clientY));touches.delete(e.pointerId);gesture=null});renderer.domElement.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);gesture=null});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();targetDist=THREE.MathUtils.clamp(targetDist+Math.sign(e.deltaY)*.8,11,27)},{passive:false});
let audioCtx=null,musicTimer=null,musicStep=0,muted=false;function unlockAudio(){if(muted)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();if(!musicTimer)musicTimer=setInterval(()=>{if(document.hidden||muted||!audioCtx||$('overlay').classList.contains('hidden')===false)return;let notes=[196,246.94,293.66,246.94,174.61,220,261.63,220];tone(notes[musicStep++%notes.length],.16,.045,'sine')},800)}catch(e){}}function tone(f,d=.1,v=.08,type='sine'){if(!audioCtx||muted||document.hidden)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(v,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.02)}function sound(kind){unlockAudio();let f={click:480,move:330,capture:180,king:740,win:880,lose:240}[kind]||400;tone(f,kind==='win'?.38:.13,.10,kind==='capture'?'triangle':'sine');if(kind==='king'||kind==='win')setTimeout(()=>tone(f*1.5,.3,.07),130)}function setSound(v){muted=!v;for(let id of ['sound','menuSound'])$(id).textContent=muted?S.unmute:S.mute;if(!muted)unlockAudio()}
const session={wins:0,losses:0,draws:0,streak:0,unlocked:new Set()};let gameCaptures=0,gameJumpStreak=0,gameLost=0,gameRecorded=false;function achievement(key){if(session.unlocked.has(key))return;session.unlocked.add(key);let el=$('achievement');el.textContent='✦ '+S.achievement+': '+S[key];el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3300)}function sessionSummary(){return `${S.session} · ${S.wins}: ${session.wins} · ${S.losses}: ${session.losses} · ${S.draws}: ${session.draws} · ${S.streak}: ${session.streak}`}let toastTimer;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1600)}function tap(i){if(i<0||locked||state.winner||!$('overlay').classList.contains('hidden')||(mode==='solo'&&state.turn!==1))return;unlockAudio();let moves=E.moves(state);let m=moves.find(x=>x.from===selected&&x.to===i);if(m){perform(m);return}if(moves.some(x=>x.from===i)){selected=i;hintSquares=[];sound('click');draw()}else if(moves.some(x=>x.cap>=0))toast(S.mandatory)}
function perform(m,byAI=false){let before=state;let next=E.apply(state,m);if(!next)return false;if(before.chain<0){history.push(JSON.parse(JSON.stringify(before)));if(history.length>200)history.shift()}state=next;if(m.cap>=0){gameCaptures++;gameJumpStreak++;if(gameJumpStreak>=3)achievement('tripleJump')}else gameJumpStreak=0;if(m.cap>=0&&before.b[m.cap]>0)gameLost++;if(Math.abs(before.b[m.from])===1&&Math.abs(state.b[m.to])===2)achievement('kingMaker');selected=state.chain>=0?state.chain:-1;hintSquares=[];let crowned=Math.abs(before.b[m.from])===1&&Math.abs(state.b[m.to])===2;sound(crowned?'king':m.cap>=0?'capture':'move');draw();if(state.chain>=0){toast(S.chain);return true}if(state.winner){setTimeout(()=>endScreen(),550);return true}if(mode==='solo'&&state.turn===-1&&!byAI)computerMove();return true}
const workerCode=document.getElementById('engine').textContent+`\nself.onmessage=e=>{const {state,level,id,limit}=e.data;try{postMessage({id,path:E.choose(state,level,limit)})}catch(err){postMessage({id,error:String(err)})}}`;try{worker=new Worker(URL.createObjectURL(new Blob([workerCode],{type:'application/javascript'})))}catch(e){console.warn('Worker unavailable',e)}function computerMove(){locked=true;draw();let id=++requestId;let start=performance.now();function finish(path){if(id!==requestId)return;let wait=Math.max(0,320-(performance.now()-start));setTimeout(()=>{if(id!==requestId)return;let step=0;function next(){if(id!==requestId)return;if(step>=path.length){locked=false;draw();return}let m=path[step++];perform(m,true);setTimeout(next,260)}next()},wait)}if(worker){worker.onmessage=e=>{if(e.data.id===id){if(e.data.path)finish(e.data.path);else{locked=false;draw()}}};worker.postMessage({id,state,level,limit:level===3?950:level===2?650:300})}else{setTimeout(()=>finish(E.choose(state,level,150)),50)}}
function start(m){requestId++;gameCaptures=0;gameJumpStreak=0;gameLost=0;gameRecorded=false;mode=m;level=+$('difficulty').value;state=E.initial();state.seen[E.key(state)]=1;selected=-1;hintSquares=[];history=[];locked=false;$('overlay').classList.add('hidden');$('modeLabel').textContent=mode==='solo'?S.solo:S.local;resetView();sound('click');draw();toast(S.welcome)}function menu(){requestId++;locked=false;$('overlay').classList.remove('hidden');showMenu();sound('click')}function showMenu(){$('panel').innerHTML=`<div class="ornament">♛</div><h1>${S.title}</h1><p>${S.subtitle}</p><div class="stack"><div class="setting"><label for="difficulty">${S.difficulty}</label><select id="difficulty"><option value="1">${S.easy}</option><option value="2">${S.medium}</option><option value="3">${S.hard}</option></select></div><button class="primary" id="solo">${S.playComputer}</button><button id="friend">${S.playFriend}</button><div class="setting"><label for="theme">${S.boardTheme}</label><select id="theme"><option value="classic">${S.classic}</option><option value="midnight">${S.midnight}</option><option value="rosewood">${S.rosewood}</option></select></div><button id="menuSound">${muted?S.unmute:S.mute}</button></div><div class="mini">${S.help}</div>`;$('difficulty').value=String(level);$('theme').value=theme;$('theme').onchange=e=>setTheme(e.target.value);$('theme').onchange=e=>setTheme(e.target.value);$('solo').onclick=()=>start('solo');$('friend').onclick=()=>start('friend');$('menuSound').onclick=()=>{setSound(muted);sound('click')}}function endScreen(){if(!state.winner)return;if(!gameRecorded&&mode==='solo'){gameRecorded=true;if(state.winner===2){session.draws++;session.streak=0}else if(state.winner===1){session.wins++;session.streak++;achievement('firstWin');if(gameLost===0)achievement('perfect')}else{session.losses++;session.streak=0}}let heading=state.winner===2?S.draw:mode==='solo'?(state.winner===1?S.youWin:S.youLose):(state.winner===1?S.lightWins:S.darkWins);$('overlay $('solo').onclick=()=>start('solo');$('friend').onclick=()=>start('friend');$('menuSound').onclick=()=>setSound(muted);$('menu').onclick=menu;$('new').onclick=()=>start(mode);$('reset').onclick=()=>{resetView();sound('click')};$('sound').onclick=()=>{setSound(muted);sound('click')};$('undo').onclick=()=>{if(locked||!history.length)return;requestId++;let undoCount=mode==='solo'&&state.turn===1&&history.length>=2?2:1;while(undoCount--&&history.length)state=history.pop();selected=-1;hintSquares=[];locked=false;draw();sound('click')};$('hint').onclick=()=>{let legal=E.moves(state);if(!legal.length)return toast(S.noHint);let m=legal[0];hintSquares=[m.from,m.to];draw();sound('click')};
window.__checkers={getState:()=>JSON.parse(JSON.stringify(state)),newGame:(m=mode)=>start(m),move:(from,to)=>{let m=E.moves(state).find(x=>x.from===from&&x.to===to);return m?perform(m,true):false},setDifficulty:n=>{level=Math.max(1,Math.min(3,Number(n)||2))},setTheme,sessionStats:()=>({...session,unlocked:[...session.unlocked]}),legalMoves:()=>E.moves(state),selfTest:()=>runSelfTest(200)};
function runSelfTest(count){let illegal=0,unfinished=0,forcedErrors=0,completed=0;for(let g=0;g<count;g++){let s=E.initial();s.seen[E.key(s)]=1;for(let n=0;n<1200&&!s.winner;n++){let legal=E.moves(s);if(!legal.length){s.winner=-s.turn;break}let cap=legal.some(x=>x.cap>=0);if(cap&&legal.some(x=>x.cap<0))forcedErrors++;let m=legal[Math.random()*legal.length|0],next=E.apply(s,m);if(!next){illegal++;break}if(E.apply(s,{from:m.from,to:(m.to+1)%64})&&m.to!==(m.to+1)%64)illegal++;s=next}if(s.winner)completed++;else unfinished++}return {games:count,completed,unfinished,illegal,forcedErrors}};
let previous=performance.now(),frames=0,slow=0;function animate(now){requestAnimationFrame(animate);if(document.hidden)return;let dt=Math.min(.05,(now-previous)/1000);previous=now;updateCamera();animations=animations.filter(a=>{if(!a.obj.parent)return false;let t=Math.min(1,(now-a.start)/a.duration);a.obj.position.y=.04+Math.sin(t*Math.PI)*(a.king?.65:.32);a.obj.rotation.y=a.king?Math.sin(t*Math.PI)*.65:0;return t<1});renderer.render(scene,camera);frames++;if(frames%120===0){slow=dt>.035?slow+1:Math.max(0,slow-1);if(slow>=3&&renderer.getPixelRatio()>1){renderer.setPixelRatio(1);slow=0}}}requestAnimationFrame(animate);draw();
