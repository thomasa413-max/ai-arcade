<style>
/* Layout idea: the game canvas is a 16:9 window onto the station; HUD and touch controls float around it.
   Single dark world: hazard amber for UI, cyan for the hero, acid green for everything alien. */
:root{
  --void:#05080e; --steel:#16222f; --cyan:#3fe0ff; --amber:#ffb02e; --acid:#9dff4a; --alarm:#ff4a5a; --ink:#e6f1f7;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#game{position:absolute;display:block;background:var(--void);touch-action:none}
#hud{position:absolute;pointer-events:none;display:none;--ct:0px}
body.playing #hud{display:block}
#hud>*{position:absolute}
#hl{left:10px;top:calc(var(--ct) + 8px);display:flex;gap:10px;align-items:center}
#hp{display:flex;gap:4px}
.pip{width:18px;height:9px;transform:skewX(-24deg);border:1.5px solid var(--cyan);background:var(--cyan);box-shadow:0 0 8px rgba(63,224,255,.6)}
.pip.off{background:transparent;box-shadow:none;opacity:.4}
#lv{display:flex;gap:4px}
.life{width:11px;height:11px;border-radius:50%;background:#cfdbe6;border:2px solid #5d7288;position:relative}
.life:after{content:"";position:absolute;right:-1px;top:2px;width:5px;height:3px;border-radius:2px;background:var(--cyan)}
#wp{left:50%;transform:translateX(-50%);top:calc(var(--ct) + 7px);font:700 13px var(--display);letter-spacing:.18em;color:var(--amber);text-shadow:0 0 8px rgba(255,176,46,.5)}
#sc{right:96px;top:calc(var(--ct) + 5px);font:700 20px var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(63,224,255,.5)}
.hb{pointer-events:auto;top:calc(var(--ct) + 6px);width:34px;height:28px;border:1.5px solid rgba(230,241,247,.45);background:rgba(5,8,14,.55);color:var(--ink);
  font:700 13px var(--display);border-radius:3px;cursor:pointer;padding:0}
#bPause{right:8px}#bMute{right:48px}
#bossbar{left:50%;transform:translateX(-50%);top:calc(var(--ct) + 38px);width:min(70%,420px);display:none}
#bossbar b{display:block;font:700 11px var(--display);letter-spacing:.3em;color:var(--alarm);margin-bottom:3px;text-align:center}
#bossbar .tr{height:8px;border:1.5px solid var(--alarm);transform:skewX(-24deg);background:rgba(255,74,90,.12)}
#bossbar i{display:block;height:100%;width:100%;background:var(--alarm);box-shadow:0 0 10px var(--alarm);transition:width .12s}
#toast{left:50%;top:calc(var(--ct) + (100% - var(--ct)) * .3);transform:translate(-50%,-50%);font:700 clamp(16px,3.6vw,30px) var(--display);letter-spacing:.25em;
  color:var(--ink);text-shadow:0 0 14px var(--cyan);opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#toast.warn{color:var(--alarm);text-shadow:0 0 16px var(--alarm)}
/* touch controls */
#touch{position:fixed;inset:0;pointer-events:none;display:none}
body.touch.playing #touch{display:block}
#dpad{position:absolute;left:18px;bottom:18px;width:150px;height:150px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle,rgba(63,224,255,.10),rgba(63,224,255,.03) 70%);border:2px solid rgba(63,224,255,.35)}
#dpad:before,#dpad:after{content:"";position:absolute;background:rgba(63,224,255,.22)}
#dpad:before{left:50%;top:10px;bottom:10px;width:2px;margin-left:-1px}
#dpad:after{top:50%;left:10px;right:10px;height:2px;margin-top:-1px}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(63,224,255,.28);border:2px solid rgba(63,224,255,.7)}
.act{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;font:700 14px var(--display);letter-spacing:.12em;
  background:rgba(5,8,14,.45)}
#bFire{right:20px;bottom:34px;width:92px;height:92px;border:2.5px solid var(--amber);color:var(--amber);box-shadow:inset 0 0 18px rgba(255,176,46,.25)}
#bJump{right:126px;bottom:70px;width:78px;height:78px;border:2.5px solid var(--cyan);color:var(--cyan);box-shadow:inset 0 0 18px rgba(63,224,255,.22)}
.act.dn{background:rgba(255,255,255,.18)}
@media (orientation:portrait){
  #dpad{bottom:12vh}#bFire{bottom:13vh}#bJump{bottom:17vh}
}
/* overlay */
#ov{position:fixed;inset:0;display:none;place-items:center;padding:16px;background:rgba(3,5,9,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:auto}
#ov.on{display:grid}
.card{width:min(560px,100%);max-height:100%;overflow:auto;padding:22px 24px 20px;background:rgba(7,12,20,.9);border:1px solid rgba(63,224,255,.25);border-inline-start:4px solid var(--amber)}
.eyebrow{font:500 12px var(--display);letter-spacing:.32em;color:var(--cyan);margin:0 0 6px}
h1{font:700 clamp(44px,13vw,84px)/.9 var(--display);letter-spacing:.02em;margin:0 0 4px;text-transform:uppercase;color:var(--ink);text-shadow:0 0 24px rgba(63,224,255,.35)}
h1 em{font-style:normal;color:var(--acid);text-shadow:0 0 24px rgba(157,255,74,.45)}
h2{font:700 clamp(28px,8vw,44px)/1 var(--display);margin:0 0 6px;text-transform:uppercase}
.stripe{height:8px;margin:12px 0 14px;background:repeating-linear-gradient(-45deg,var(--amber) 0 8px,#1a1405 8px 16px);opacity:.9}
.card p{margin:0 0 10px;font-size:16px;line-height:1.35;color:#c4d3df;max-width:60ch}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px;margin:10px 0 14px;color:#9fb2c2}
.keys b{color:var(--ink);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{font:700 15px var(--display);letter-spacing:.14em;text-transform:uppercase;padding:13px 22px;border:0;cursor:pointer;color:#120c00;background:var(--amber);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(230,241,247,.45);clip-path:none;border-radius:2px}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{background:rgba(5,8,14,.7);color:var(--ink);border:1px solid rgba(230,241,247,.4);font:500 13px var(--body);padding:4px 6px;border-radius:2px;max-width:42%}
a.btn{text-decoration:none;display:inline-block}
[dir=rtl] *{letter-spacing:0!important}
.tip{display:none}
@media (orientation:portrait){.tip{display:block;font-size:13px!important;color:var(--amber)!important;margin-top:10px!important}}
.note{font-size:13px!important;color:#7f93a5!important;margin-top:12px!important}
.stat{display:flex;gap:22px;margin:8px 0 12px;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.stat small{display:block;font:500 11px var(--display);letter-spacing:.25em;color:var(--cyan)}
@media (max-height:430px){.card{padding:12px 16px}.keys{font-size:12px;margin:6px 0 8px}.card p{font-size:14px;margin-bottom:6px}h1{font-size:44px}.stripe{margin:6px 0 8px}.btn{padding:10px 18px}.note{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

    if(o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+d);

const glowCache={};
function gs(col){
  if(glowCache[col])return glowCache[col];
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,col+'ff'); r.addColorStop(.4,col+'55'); r.addColorStop(1,col+'00');
  g.fillStyle=r; g.fillRect(0,0,64,64); return glowCache[col]=c;
}
function glow(x,y,r,col,a){ctx.globalAlpha=a==null?1:a; ctx.drawImage(gs(col),x-r,y-r,r*2,r*2); ctx.globalAlpha=1}

/* ================= gameplay ================= */
function phys(e,dt){
  e.vy+=1500*dt; if(e.vy>720) e.vy=720;
  const py=e.y, ny=e.y+e.vy*dt; e.x+=e.vx*dt; e.on=false;
  if(e.drop>0) e.drop-=dt;
  if(e.vy>=0){ const ly=landY(e.x-e.w/2,e.x+e.w/2,py,ny,e.drop>0); if(ly!==null){e.y=ly;e.vy=0;e.on=true;return} }
  e.y=ny;
}
function hb(e){ return e.fly?{x:e.x-e.w/2,y:e.y-e.h/2,w:e.w,h:e.h}:{x:e.x-e.w/2,y:e.y-e.h,w:e.w,h:e.h}; }
function pbox(){const h=P.crouch?18:26; return{x:P.x-6,y:P.y-h,w:12,h}}
function ov2(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function updPlayer(dt,I,jp){
  if(P.dead>0){P.dead-=dt; if(P.dead<=0){ if(P.lives<=0) gameOver(); else respawn(); } return}
  if(P.inv>0)P.inv-=dt; if(P.cd>0)P.cd-=dt; if(P.flash>0)P.flash-=dt;
  P.crouch=I.d&&P.on&&!I.l&&!I.r;
  let dir=(I.r?1:0)-(I.l?1:0); if(P.crouch)dir=0;
  P.vx+=(dir*150-P.vx)*Math.min(1,dt*(P.on?18:9));
  if(dir)P.face=dir;
  // aim
  let ax=P.face, ay=0;
  if(I.u){ay=-1; ax=dir?dir:0}
  else if(I.d&&!P.on){ay=1; ax=dir?dir:0}
  const m=Math.hypot(ax,ay)||1; P.ax=ax/m; P.ay=ay/m;
  // jump
  P.coyote=P.on?.1:P.coyote-dt; P.jbuf=jp?.12:P.jbuf-dt;
  if(P.jbuf>0){
    const pl=P.on?platUnder(P.x,P.y):null;
    if(I.d&&P.on&&pl&&pl.drop){P.drop=.28;P.on=false;P.y+=2;P.vy=80;P.jbuf=0;P.coyote=0}
    else if(P.coyote>0){P.vy=-500;P.on=false;P.coyote=0;P.jbuf=0;A.sfx('jump')}
  }
  if(!I.jump&&P.vy<-170) P.vy+=2400*dt;
  const wasOn=P.on, pvy=P.vy;
  phys(P,dt);
  if(!wasOn&&P.on&&pvy>250) A.sfx('land');

function groundX(x){ for(let d=0;d<220;d+=6){ if(floorAt(x+d)) return x+d; } for(let d=0;d<220;d+=6){ if(floorAt(x-d)) return x-d; } return null; }

function killEnemy(e){

function updEnemy(e,dt){
  e.t+=dt; e.anim+=dt*(e.type==='crawler'?10:1); if(e.flash>0)e.flash-=dt;
  const dx=P.x-e.x;
  switch(e.type){
    case'crawler':{
      const dir=Math.sign(dx)||1;
      if(e.state==='wind'){e.vx=0; e.wt-=dt; e.face=dir; if(e.wt<=0){e.state='air';e.vy=-300;e.vx=dir*210;e.on=false}}
      else if(e.state==='air'){ if(e.on){e.state='run';e.cool=1.2+Math.random()} }
      else{
        e.face=dir; let v=dir*e.sp;
        if(e.on&&!groundAt(e.x+dir*(e.w/2+6),e.y)) v=0;
        e.vx=v; e.cool-=dt;
        if(e.on&&e.cool<=0&&Math.abs(dx)<150&&Math.abs(dx)>45){e.state='wind';e.wt=.35}
      }
      phys(e,dt); if(e.y>LH+60)e.dead=true; break;

      if(e.x<camX-220||e.x>camX+VW+320) e.dead=true; break;
    }
    case'spitter':{
      e.face=dx>0?1:-1;
      const near=Math.abs(dx)<430&&e.x>camX-10&&e.x<camX+VW+10;
      if(near){ e.cd-=dt; if(e.cd<=0){ spitAt(e); e.cd=2.1+Math.random()*.6 } }
      e.wind=near?clamp(1-e.cd/.6,0,1):0; break;
    }
    case'eel':{
      if(e.state==='wait'){ e.wt-=dt; if(e.wt<=0){e.state='leap'; e.vy=-650-rnd(0,50)} }
      else{ e.vy+=1100*dt; e.y+=e.vy*dt; if(e.vy>0&&e.y>LH+10){ e.n++; if(e.n>=2){e.dead=true} else {e.state='wait'; e.wt=.5; e.y=LH+14; e.x=clamp(e.x+rnd(-60,60),e.gx1+20,e.gx2-20)} } }
      break;
    }
    case'egg':{
      if(Math.abs(dx)<150&&e.x>camX&&e.x<camX+VW){ e.ht=(e.ht||0)+dt; if(e.ht>.9){ e.dead=true; A.sfx('pod'); boom(e.x,e.y-12,9,'#ff9a5a'); for(let i=0;i<2;i++) mk('w',e.x+(i?10:-10),e.y-14,{face:-1}) } }
      break;

function spitAt(e){

function fan(e){
  const ox=e.x-52*e.sc, oy=e.y-78*e.sc, base=Math.atan2(P.y-16-oy,P.x-ox), c=[0,3,5,7][e.phase], v=LVL===3?235:210;
  for(let i=0;i<c;i++){const a=base+(i-(c-1)/2)*.27; ebullets.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:0,r:5,life:4,col:BOSSC[LVL].col})}

function updBoss(e,dt){

function pickup(p){

function update(dt){
  S.time+=dt;
  const I=readInput(), jp=I.jump&&!S.jprev; S.jprev=I.jump;
  updPlayer(dt,I,jp);
  // camera
  if(S.bossStarted){ const bx=boss?boss.x:P.x, tg=clamp((P.x+bx)/2-VW/2,ARENA,WORLD-VW); camX+=clamp(tg-camX,-260*dt,260*dt) } else { camX=clamp(Math.max(camX,P.x-VW*.39),0,WORLD-VW) }
  // triggers
  while(S.trig<TRIG.length&&P.x>TRIG[S.trig].x&&!S.bossStarted){ const t=TRIG[S.trig++]; for(let i=0;i<t.e.length;i++) spawnQ.push({t:i*.85,k:t.e[i]}); }
  for(let i=spawnQ.length-1;i>=0;i--){ spawnQ[i].t-=dt; if(spawnQ[i].t<=0){spawnFrom(spawnQ[i].k); spawnQ.splice(i,1)} }
  // checkpoints
  for(const c of CHECKS){ if(P.x>c&&!S.reached.includes(c)){S.reached.push(c);S.check=c;A.sfx('check');toast(t('check'),1300)} }
  // boss start
  if(!S.bossStarted&&P.x>ARENA+40){
    S.bossStarted=true; spawnQ.length=0; toast(t('warn'),2200,true); A.sfx('alarm'); S.shake=.4;
    const BC=BOSSC[LVL];
    boss=mk('b',WORLD+70,GROUND,{state:'enter',cd:1.4,face:-1,phase:1,base:WORLD-(VW>600?BC.off:BC.offP),mouth:0,glow:0,last:'',w:BC.w,h:BC.h,hp:BC.hp,max:BC.hp,sc:BC.sc,dx:BC.dx,score:BC.score});
  }
  // enemies
  for(const e of enemies){
    if(e.dead)continue;
    const near=e.x>camX-90&&e.x<camX+VW+90;
    if(near||e.type==='crawler'||e.type==='swarmer'||e.type==='eel'||e.type==='boss') updEnemy(e,dt);
    if(e.type==='crawler'&&e.x<camX-240) e.dead=true;
  }
  // player bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    let rm=b.life<=0||b.x<camX-20||b.x>camX+VW+20||b.y<-20||b.y>LH+20;
    if(!rm){
      for(const e of enemies){
        if(e.dead||e.state==='dying')continue; const h=hb(e);
        if(b.x>h.x-b.r&&b.x<h.x+h.w+b.r&&b.y>h.y-b.r&&b.y<h.y+h.h+b.r){
          e.hp--; e.flash=.07; sparks(b.x,b.y,4,e.type==='pod'?'#ffb02e':'#b6ff3c',140,.3); A.sfx('hit'); rm=true; if(e.hp<=0) killEnemy(e); break;
        }

    }

    const b=ebullets[i], py=b.y; b.vy+=b.g*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    let rm=b.life<=0||b.y>LH+30||b.x<camX-40||b.x>camX+VW+40||b.y<-40;
    if(!rm&&b.g&&b.vy>0&&landY(b.x-1,b.x+1,py,b.y,false)!==null){rm=true; blobs(b.x,b.y,6,'#9dff4a',110); A.sfx('splat')}
    if(!rm&&P.dead<=0){ const pb=pbox(); if(b.x>pb.x-b.r&&b.x<pb.x+pb.w+b.r&&b.y>pb.y-b.r&&b.y<pb.y+pb.h+b.r){ rm=true; blobs(b.x,b.y,6,'#9dff4a',110); hurtPlayer(b.x) } }
    if(rm) ebullets.splice(i,1);
  }

  if(P.dead<=0&&P.inv<=0){ const pb=pbox(); for(const e of enemies){ if(e.dead||e.type==='pod'||e.type==='egg'||e.state==='dying')continue; if(ov2(pb,hb(e))){hurtPlayer(e.x);break} } }
  if(ARCS.length&&P.dead<=0&&P.inv<=0&&P.y>GROUND-60){ for(const a of ARCS){ if(arcOn(a)&&Math.abs(P.x-a[0])<9){hurtPlayer(a[0]);break} } }

    if(P.dead<=0&&Math.abs(p.x-P.x)<14&&p.y>P.y-30&&p.y<P.y+8){pickup(p);pickups.splice(i,1)}

  S.danger=danger?3:S.danger-dt; A.setMode(boss?2:S.danger>0?1:0);

}

/* ================= pre-rendered background layers ================= */
function mkLayer(fn,seed){

const farFn=(c,R)=>{

  for(let i=0;i<260;i++){const r=.3+Math.pow(R(),3)*1.2; c.fillStyle='rgba(200,225,255,'+(.25+R()*.7)+')'; c.beginPath(); c.arc(R()*1280,R()*LH,r,0,TAU); c.fill()}

  c.fillStyle=g; c.beginPath(); c.arc(860,170,120,0,TAU); c.fill();
  c.save(); c.beginPath(); c.arc(860,170,120,0,TAU); c.clip();

function boltCol(x){

  for(const [w,c,al] of [[11,'#2affd8',.5],[4,'#eaffff',1]]){ ctx.strokeStyle=c; ctx.globalAlpha=al; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x,0); for(let y=14;y<GROUND;y+=14) ctx.lineTo(x+rnd(-8,8),y); ctx.lineTo(x,GROUND); ctx.stroke() }
  ctx.globalAlpha=1; glow(x,GROUND-6,44,'#2affd8',.9); ctx.globalCompositeOperation='source-over';
}
function drawLeviathan(e){
  const a=e.t, f=e.flash>0, dying=e.state==='dying', jit=dying?Math.sin(e.at*60)*2:0, body=f?'#fff':'#0a1a20', hi='rgba(110,255,240,.5)';
  if(e.state==='bolt'&&e.bt){
    for(const x of e.bt){
      if(e.at<.95){ ctx.globalAlpha=.35+.4*Math.abs(Math.sin(e.at*30)); ctx.fillStyle='#ff4a5a'; ctx.fillRect(x-1,0,2,GROUND); ctx.globalAlpha=1; ctx.globalCompositeOperation='lighter'; glow(x,GROUND-2,18,'#ff4a5a',.7); ctx.globalCompositeOperation='source-over' }
      else if(e.at<1.3) boltCol(x);
    }
  }
  ctx.save(); ctx.translate(e.x+jit,e.y); ctx.lineCap='round'; ctx.lineJoin='round';
  for(let i=0;i<6;i++){ const bx=-46+i*18, w1=Math.sin(a*2+i*1.3)*10, w2=Math.sin(a*2.4+i)*8, lean=(i-2.5)*9;
    ctx.strokeStyle=body; ctx.lineWidth=10-Math.abs(i-2.5)*1.2; ctx.beginPath(); ctx.moveTo(bx,-30); ctx.bezierCurveTo(bx+lean+w1,-14,bx+lean*1.8+w2,-6,bx+lean*2.4+w1,0); ctx.stroke() }

function drawEel(e){
  if(e.state==='wait'){ const k=clamp(1-e.wt/.6,0,1), y0=GROUND+16; ctx.strokeStyle='rgba(190,255,250,'+(.3+.5*k)+')'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.ellipse(e.x,y0,8+k*14,2+k*2,0,0,TAU); ctx.stroke(); return }

  ctx.fillStyle='#e8f6f4'; ctx.beginPath(); ctx.moveTo(-3,-16); ctx.lineTo(-1.5,-11); ctx.lineTo(0,-16); ctx.moveTo(0,-16); ctx.lineTo(1.5,-11); ctx.lineTo(3,-16); ctx.fill();
  ctx.restore();

function drawEgg(e){
  const k=e.ht||0, wob=k>0?Math.sin(e.t*30)*Math.min(2.5,k*3):0, f=e.flash>0;
  ctx.save(); ctx.translate(e.x+wob,e.y);

function drawEnemy(e){

function drawParticles(){
  for(const p of parts){

function render(){

/* ================= main loop ================= */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(ts-last)/1000||0); last=ts; dtG=dt;
  if(S.state==='play'){update(dt); updHud()} else if(S.state==='title') updTitle(dt);
  render();
}
function boot(){
  layout(); loadLevel(1); initLang(); resetLevel(0); S.state='title'; showTitle(); requestAnimationFrame(frame);
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
