<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hive Breach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the game canvas is a 16:9 window onto the station; HUD and touch controls float around it.
   Single dark world: hazard amber for UI, cyan for the hero, acid green for everything alien. */
:root{
  --void:#05080e; --steel:#16222f; --cyan:#3fe0ff; --amber:#ffb02e; --acid:#9dff4a; --alarm:#ff4a5a; --ink:#e6f1f7;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#game{position:absolute;display:block;background:var(--void);touch-action:none}
#hud{position:absolute;pointer-events:none;display:none;--ct:0px}
body.playing #hud{display:block}
#hud>*{position:absolute}
#hl{left:10px;top:calc(var(--ct) + 8px);display:flex;gap:10px;align-items:center}
#hp{display:flex;gap:4px}
.pip{width:18px;height:9px;transform:skewX(-24deg);border:1.5px solid var(--cyan);background:var(--cyan);box-shadow:0 0 8px rgba(63,224,255,.6)}
.pip.off{background:transparent;box-shadow:none;opacity:.4}
#lv{display:flex;gap:4px}
.life{width:11px;height:11px;border-radius:50%;background:#cfdbe6;border:2px solid #5d7288;position:relative}
.life:after{content:"";position:absolute;right:-1px;top:2px;width:5px;height:3px;border-radius:2px;background:var(--cyan)}
#wp{left:50%;transform:translateX(-50%);top:calc(var(--ct) + 7px);font:700 13px var(--display);letter-spacing:.18em;color:var(--amber);text-shadow:0 0 8px rgba(255,176,46,.5)}
#sc{right:96px;top:calc(var(--ct) + 5px);font:700 20px var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(63,224,255,.5)}
.hb{pointer-events:auto;top:calc(var(--ct) + 6px);width:34px;height:28px;border:1.5px solid rgba(230,241,247,.45);background:rgba(5,8,14,.55);color:var(--ink);
  font:700 13px var(--display);border-radius:3px;cursor:pointer;padding:0}
#bPause{right:8px}#bMute{right:48px}
#bossbar{left:50%;transform:translateX(-50%);top:calc(var(--ct) + 38px);width:min(70%,420px);display:none}
#bossbar b{display:block;font:700 11px var(--display);letter-spacing:.3em;color:var(--alarm);margin-bottom:3px;text-align:center}
#bossbar .tr{height:8px;border:1.5px solid var(--alarm);transform:skewX(-24deg);background:rgba(255,74,90,.12)}
#bossbar i{display:block;height:100%;width:100%;background:var(--alarm);box-shadow:0 0 10px var(--alarm);transition:width .12s}
#toast{left:50%;top:calc(var(--ct) + (100% - var(--ct)) * .3);transform:translate(-50%,-50%);font:700 clamp(16px,3.6vw,30px) var(--display);letter-spacing:.25em;
  color:var(--ink);text-shadow:0 0 14px var(--cyan);opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#toast.warn{color:var(--alarm);text-shadow:0 0 16px var(--alarm)}
/* touch controls */
#touch{position:fixed;inset:0;pointer-events:none;display:none}
body.touch.playing #touch{display:block}
#dpad{position:absolute;left:18px;bottom:18px;width:150px;height:150px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle,rgba(63,224,255,.10),rgba(63,224,255,.03) 70%);border:2px solid rgba(63,224,255,.35)}
#dpad:before,#dpad:after{content:"";position:absolute;background:rgba(63,224,255,.22)}
#dpad:before{left:50%;top:10px;bottom:10px;width:2px;margin-left:-1px}
#dpad:after{top:50%;left:10px;right:10px;height:2px;margin-top:-1px}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(63,224,255,.28);border:2px solid rgba(63,224,255,.7)}
.act{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;font:700 14px var(--display);letter-spacing:.12em;
  background:rgba(5,8,14,.45)}
#bFire{right:20px;bottom:34px;width:92px;height:92px;border:2.5px solid var(--amber);color:var(--amber);box-shadow:inset 0 0 18px rgba(255,176,46,.25)}
#bJump{right:126px;bottom:70px;width:78px;height:78px;border:2.5px solid var(--cyan);color:var(--cyan);box-shadow:inset 0 0 18px rgba(63,224,255,.22)}
.act.dn{background:rgba(255,255,255,.18)}
@media (orientation:portrait){
  #dpad{bottom:12vh}#bFire{bottom:13vh}#bJump{bottom:17vh}
}
/* overlay */
#ov{position:fixed;inset:0;display:none;place-items:center;padding:16px;background:rgba(3,5,9,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:auto}
#ov.on{display:grid}
.card{width:min(560px,100%);max-height:100%;overflow:auto;padding:22px 24px 20px;background:rgba(7,12,20,.9);border:1px solid rgba(63,224,255,.25);border-left:4px solid var(--amber)}
.eyebrow{font:500 12px var(--display);letter-spacing:.32em;color:var(--cyan);margin:0 0 6px}
h1{font:700 clamp(44px,13vw,84px)/.9 var(--display);letter-spacing:.02em;margin:0 0 4px;text-transform:uppercase;color:var(--ink);text-shadow:0 0 24px rgba(63,224,255,.35)}
h1 em{font-style:normal;color:var(--acid);text-shadow:0 0 24px rgba(157,255,74,.45)}
h2{font:700 clamp(28px,8vw,44px)/1 var(--display);margin:0 0 6px;text-transform:uppercase}
.stripe{height:8px;margin:12px 0 14px;background:repeating-linear-gradient(-45deg,var(--amber) 0 8px,#1a1405 8px 16px);opacity:.9}
.card p{margin:0 0 10px;font-size:16px;line-height:1.35;color:#c4d3df;max-width:60ch}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px;margin:10px 0 14px;color:#9fb2c2}
.keys b{color:var(--ink);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{font:700 15px var(--display);letter-spacing:.14em;text-transform:uppercase;padding:13px 22px;border:0;cursor:pointer;color:#120c00;background:var(--amber);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(230,241,247,.45);clip-path:none;border-radius:2px}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.tip{display:none}
@media (orientation:portrait){.tip{display:block;font-size:13px!important;color:var(--amber)!important;margin-top:10px!important}}
.note{font-size:13px!important;color:#7f93a5!important;margin-top:12px!important}
.stat{display:flex;gap:22px;margin:8px 0 12px;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.stat small{display:block;font:500 11px var(--display);letter-spacing:.25em;color:var(--cyan)}
@media (max-height:430px){.card{padding:12px 16px}.keys{font-size:12px;margin:6px 0 8px}.card p{font-size:14px;margin-bottom:6px}h1{font-size:44px}.stripe{margin:6px 0 8px}.btn{padding:10px 18px}.note{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="Hive Breach game"></canvas>
<div id="hud">
  <div id="hl"><div id="hp"></div><div id="lv"></div></div>
  <div id="wp">RIFLE</div>
  <div id="sc">0</div>
  <button class="hb" id="bMute" aria-label="Toggle sound">♪</button>
  <button class="hb" id="bPause" aria-label="Pause">II</button>
  <div id="bossbar"><b>HIVE QUEEN</b><div class="tr"><i></i></div></div>
  <div id="toast"></div>
</div>
<div id="touch">
  <div id="dpad"><div id="knob"></div></div>
  <div class="act" id="bJump">JUMP</div>
  <div class="act" id="bFire">FIRE</div>
</div>
<div id="ov"></div>

<script>
(()=>{
'use strict';
/* ================= constants & helpers ================= */
let VW=640; const LH=360, WORLD=7200, GROUND=300, ARENA=WORLD-640, LS=2, TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
let hi=0; try{hi=+localStorage.getItem('hb-hi')||0}catch(e){}

/* ================= audio (all synthesized, no files) ================= */
const A=(()=>{
  let ac,master,musicG,sfxG,verb,noiseBuf,muted=false,mode=-1,timer=null,nextT=0,step=0,lastHit=0;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  const stepDur=()=>mode===2?.1:mode===1?.1154:.125;
  function init(){
    if(ac){ if(ac.state==='suspended') ac.resume(); return; }
    try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=6;
    master=ac.createGain(); master.gain.value=muted?0:.85; master.connect(comp); comp.connect(ac.destination);
    musicG=ac.createGain(); musicG.gain.value=.55; musicG.connect(master);
    sfxG=ac.createGain(); sfxG.gain.value=.9; sfxG.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const len=ac.sampleRate*2.4, ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let ch=0;ch<2;ch++){const o=ir.getChannelData(ch);for(let i=0;i<len;i++)o[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    const cv=ac.createConvolver(); cv.buffer=ir; verb=ac.createGain(); verb.gain.value=.32; verb.connect(cv); cv.connect(master);
    nextT=ac.currentTime+.08; step=0;
    timer=setInterval(sched,30);
  }
  function tone(f,t,d,type,v,o){
    o=o||{}; const os=ac.createOscillator(), g=ac.createGain();
    os.type=type||'sine'; os.frequency.setValueAtTime(f,t);
    if(o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+d);
    if(o.det) os.detune.value=o.det;
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+(o.a||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    let n=os;
    if(o.lp){const f2=ac.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=o.lp; os.connect(f2); n=f2}
    n.connect(g); g.connect(o.dest||sfxG); if(o.verb) g.connect(verb);
    os.start(t); os.stop(t+d+.05);
  }
  function noise(t,d,v,o){
    o=o||{}; const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=ac.createBiquadFilter(); f.type=o.type||'lowpass'; f.frequency.setValueAtTime(o.f||2000,t);
    if(o.to) f.frequency.exponentialRampToValueAtTime(Math.max(30,o.to),t+d); f.Q.value=o.q||.7;
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(g); g.connect(o.dest||sfxG); if(o.verb) g.connect(verb);
    s.start(t,Math.random()*.5); s.stop(t+d+.05);
  }
  function kick(t){tone(165,t,.17,'sine',.42,{to:42,dest:musicG}); noise(t,.02,.08,{type:'highpass',f:2500,dest:musicG})}
  function snare(t){noise(t,.14,.15,{type:'bandpass',f:1800,q:.8,dest:musicG}); tone(210,t,.09,'triangle',.09,{to:120,dest:musicG})}
  function hat(t,v){noise(t,.04,v,{type:'highpass',f:7500,dest:musicG})}
  function bass(f,t,d,v){tone(f,t,d,'sawtooth',v||.12,{lp:520,dest:musicG,a:.004}); tone(f,t,d,'sine',.1,{dest:musicG})}
  function playStep(t,n){
    const s=n%16, bar=((n/16)|0)%4, sd=stepDur();
    const r=(mode===2?[0,0,1,-2]:[0,1,0,-2])[bar];
    if(s===0){
      [0,7,15].forEach((iv,i)=>{
        tone(mf(52+r+iv),t,sd*16,'sawtooth',mode===2?.034:.028,{a:.9,lp:mode?950:640,det:-6+i*3,dest:musicG,verb:true});
        tone(mf(52+r+iv),t,sd*16,'sawtooth',mode===2?.034:.028,{a:.9,lp:mode?950:640,det:8,dest:musicG,verb:true});
      });
      tone(mf(40+r),t,sd*16,'sine',.12,{a:.3,dest:musicG});
      tone(mf(28+r),t,sd*16,'sine',.12,{a:.3,dest:musicG});
    }
    if(mode===0){
      if(s===8&&bar%2===0) tone(mf(76+pick([0,3,7,10,12])+r),t,1.8,'sine',.035,{verb:true,dest:musicG});
      if(s===0&&bar%2===1) noise(t,1.8,.035,{type:'bandpass',f:300,to:1400,q:1.2,dest:musicG,verb:true});
      if(s%8===4) hat(t,.012);
    }else if(mode>=1){
      const boss=mode===2;
      if((boss?[0,3,6,8,11,14]:[0,4,8,12]).includes(s)) kick(t);
      if(s===4||s===12) snare(t);
      if(boss||s%2===0) hat(t,s%4===2?.06:.032);
      if(boss) bass(mf(40+r+(s%4===3?12:0)),t,sd*.9,.12);
      else if(s%2===0) bass(mf(40+r+(s%8===6?12:0)),t,sd*1.6,.12);
      if(boss||s%2===0){
        const idx=[0,2,4,5,4,2,1,3][(boss?s:s/2)%8], sc=[0,3,7,10,12,15,19,22];
        tone(mf(64+r+sc[idx]),t,sd*1.8,'square',.026,{lp:2300,verb:true,dest:musicG});
      }
    }
  }
  function sched(){
    if(!ac||mode<0){ if(ac) nextT=Math.max(nextT,ac.currentTime+.05); return }
    if(nextT<ac.currentTime-.4) nextT=ac.currentTime+.05;
    while(nextT<ac.currentTime+.12){playStep(nextT,step); nextT+=stepDur(); step++}
  }
  function sfx(n){
    if(!ac||muted) return; const t=ac.currentTime;
    if(n==='hit'){ if(t-lastHit<.035) return; lastHit=t; noise(t,.05,.07,{type:'bandpass',f:2400}); tone(220,t,.05,'square',.035); return }
    switch(n){
      case'shoot': tone(900,t,.09,'square',.06,{to:180}); noise(t,.04,.04,{type:'highpass',f:3000}); break;
      case'shootS': tone(520,t,.12,'sawtooth',.07,{to:90}); noise(t,.09,.07,{type:'bandpass',f:2500}); break;
      case'shootR': tone(1250,t,.05,'square',.045,{to:420}); break;
      case'kill': noise(t,.35,.2,{f:1800,to:120}); tone(160,t,.3,'sawtooth',.1,{to:40}); break;
      case'boom': noise(t,1.1,.32,{f:1500,to:60,verb:true}); tone(90,t,.9,'sine',.3,{to:30}); break;
      case'spit': tone(300,t,.18,'sine',.1,{to:900}); noise(t,.12,.05,{type:'bandpass',f:900}); break;
      case'hurt': tone(420,t,.3,'sawtooth',.14,{to:70}); noise(t,.2,.12,{f:900,to:200}); break;
      case'die': tone(300,t,.8,'sawtooth',.14,{to:40}); noise(t,.8,.14,{f:1000,to:80}); break;
      case'jump': tone(260,t,.14,'sine',.09,{to:560}); break;
      case'land': noise(t,.06,.06,{f:500}); break;
      case'splat': noise(t,.1,.08,{type:'bandpass',f:1200,to:300}); break;
      case'pod': noise(t,.25,.16,{type:'bandpass',f:1600,to:400}); tone(700,t,.1,'square',.05,{to:200}); break;
      case'pickup': [660,880,1320].forEach((f,i)=>tone(f,t+i*.07,.2,'triangle',.11,{verb:true})); break;
      case'heal': [523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.25,'triangle',.11,{verb:true})); break;
      case'check': tone(880,t,.5,'sine',.1,{verb:true}); tone(1318,t+.12,.6,'sine',.1,{verb:true}); break;
      case'roar': tone(110,t,1.4,'sawtooth',.16,{to:55,lp:900}); tone(113,t,1.4,'sawtooth',.12,{to:57,lp:700,det:12}); noise(t,1.2,.14,{type:'bandpass',f:300,to:1200,q:2,verb:true}); break;
      case'alarm': for(let i=0;i<4;i++){tone(880,t+i*.38,.2,'square',.05,{lp:2200}); tone(660,t+i*.38+.19,.2,'square',.05,{lp:2200})} break;
      case'charge': tone(70,t,.9,'sawtooth',.1,{to:150,lp:500}); noise(t,.9,.1,{f:200,to:900}); break;
      case'win': [392,494,587,784,988].forEach((f,i)=>tone(f,t+i*.16,.9,'triangle',.13,{verb:true})); break;
      case'over': [392,330,262,196].forEach((f,i)=>tone(f,t+i*.3,.6,'sawtooth',.09,{lp:1200,verb:true})); break;
      case'ui': tone(700,t,.06,'square',.05); break;
    }
  }
  return{init,sfx,setMode:m=>{if(m!==mode){mode=m;}},get muted(){return muted},
    toggle(){muted=!muted; if(master) master.gain.value=muted?0:.85; return muted}};
})();

/* ================= canvas, layout, input ================= */
const cv=$('#game'), ctx=cv.getContext('2d'), hud=$('#hud'), ov=$('#ov');
let scale=1, portrait=false, isTouch=false;
try{isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window}catch(e){}
if(isTouch) document.body.classList.add('touch');
function layout(){
  const W=innerWidth,H=innerHeight; portrait=H>W*1.02; VW=portrait?460:640;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const topPad=portrait?50:0;
  const cw=portrait?W:Math.min(W,H*VW/LH), ch=cw*LH/VW;
  const left=(W-cw)/2, top=portrait?topPad:(H-ch)/2;
  cv.style.left=left+'px'; cv.style.top=top+'px'; cv.style.width=cw+'px'; cv.style.height=ch+'px';
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); scale=cv.width/VW;
  hud.style.left=left+'px'; hud.style.width=cw+'px';
  hud.style.top=(portrait?0:top)+'px'; hud.style.height=(portrait?topPad+ch:ch)+'px';
  hud.style.setProperty('--ct',portrait?topPad+'px':'0px');
}
addEventListener('resize',layout); addEventListener('orientationchange',()=>setTimeout(layout,120));
const keys={}, touch={l:0,r:0,u:0,d:0,jump:0,fire:0};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)&&!(e.target&&e.target.tagName==='BUTTON')) e.preventDefault();
  if(!keys[e.code]){
    if(e.code==='KeyP'||e.code==='Escape'){ if(S.state==='play') pauseGame(); else if(S.state==='pause') resumeGame(); }
    if(e.code==='KeyM') toggleMute();
  }
  keys[e.code]=1; A.init();
});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0; if(S.state==='play')pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.state==='play')pauseGame()});
addEventListener('contextmenu',e=>e.preventDefault());
function holdBtn(el,key){
  const on=e=>{e.preventDefault(); touch[key]=1; el.classList.add('dn'); try{el.setPointerCapture(e.pointerId)}catch(_){} A.init();};
  const off=e=>{e.preventDefault(); touch[key]=0; el.classList.remove('dn')};
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off);
}
holdBtn($('#bJump'),'jump'); holdBtn($('#bFire'),'fire');
(()=>{
  const pad=$('#dpad'), knob=$('#knob'); let pid=null;
  function upd(e){
    const r=pad.getBoundingClientRect(), R=r.width/2, dx=e.clientX-(r.left+R), dy=e.clientY-(r.top+R);
    touch.l=dx<-R*.28?1:0; touch.r=dx>R*.28?1:0; touch.u=dy<-R*.42?1:0; touch.d=dy>R*.42?1:0;
    const m=Math.hypot(dx,dy)||1, k=Math.min(m,R*.6); knob.style.transform='translate('+(dx/m*k)+'px,'+(dy/m*k)+'px)';
  }
  function end(){pid=null; touch.l=touch.r=touch.u=touch.d=0; knob.style.transform=''}
  pad.addEventListener('pointerdown',e=>{e.preventDefault(); pid=e.pointerId; try{pad.setPointerCapture(pid)}catch(_){} upd(e); A.init()});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();upd(e)}});
  pad.addEventListener('pointerup',e=>{if(e.pointerId===pid)end()}); pad.addEventListener('pointercancel',end); pad.addEventListener('lostpointercapture',end);
})();
function gpRead(){

/* ================= gameplay ================= */
function phys(e,dt){
  e.vy+=1500*dt; if(e.vy>720) e.vy=720;
  const py=e.y, ny=e.y+e.vy*dt; e.x+=e.vx*dt; e.on=false;
  if(e.drop>0) e.drop-=dt;
  if(e.vy>=0){ const ly=landY(e.x-e.w/2,e.x+e.w/2,py,ny,e.drop>0); if(ly!==null){e.y=ly;e.vy=0;e.on=true;return} }
  e.y=ny;
}
function hb(e){ return e.fly?{x:e.x-e.w/2,y:e.y-e.h/2,w:e.w,h:e.h}:{x:e.x-e.w/2,y:e.y-e.h,w:e.w,h:e.h}; }
function pbox(){const h=P.crouch?18:26; return{x:P.x-6,y:P.y-h,w:12,h}}
function ov2(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function updPlayer(dt,I,jp){
  if(P.dead>0){P.dead-=dt; if(P.dead<=0){ if(P.lives<=0) gameOver(); else respawn(); } return}
  if(P.inv>0)P.inv-=dt; if(P.cd>0)P.cd-=dt; if(P.flash>0)P.flash-=dt;
  P.crouch=I.d&&P.on&&!I.l&&!I.r;
  let dir=(I.r?1:0)-(I.l?1:0); if(P.crouch)dir=0;
  P.vx+=(dir*150-P.vx)*Math.min(1,dt*(P.on?18:9));
  if(dir)P.face=dir;
  // aim
  let ax=P.face, ay=0;
  if(I.u){ay=-1; ax=dir?dir:0}
  else if(I.d&&!P.on){ay=1; ax=dir?dir:0}
  const m=Math.hypot(ax,ay)||1; P.ax=ax/m; P.ay=ay/m;
  // jump
  P.coyote=P.on?.1:P.coyote-dt; P.jbuf=jp?.12:P.jbuf-dt;
  if(P.jbuf>0){
    const pl=P.on?platUnder(P.x,P.y):null;
    if(I.d&&P.on&&pl&&pl.drop){P.drop=.28;P.on=false;P.y+=2;P.vy=80;P.jbuf=0;P.coyote=0}
    else if(P.coyote>0){P.vy=-500;P.on=false;P.coyote=0;P.jbuf=0;A.sfx('jump')}
  }
  if(!I.jump&&P.vy<-170) P.vy+=2400*dt;
  const wasOn=P.on, pvy=P.vy;
  phys(P,dt);
  if(!wasOn&&P.on&&pvy>250) A.sfx('land');
  P.anim+=dt*Math.abs(P.vx)*.075;
  const lb=S.bossStarted?ARENA+10:camX+10; if(P.x<lb){P.x=lb;P.vx=Math.max(0,P.vx)}
  if(P.x>WORLD-12)P.x=WORLD-12;
  if(P.y>LH+50&&P.dead<=0){P.hp=0;killPlayer()}
  if(I.fire&&P.cd<=0) fire();
}
function fire(){
  const w=WPN[P.weapon]; P.cd=w.cd; P.flash=.06;
  const sx=P.x, sy=P.y-(P.crouch?11:19), mx=sx+P.ax*20, my=sy+P.ay*20, a=Math.atan2(P.ay,P.ax);
  for(let i=0;i<w.n;i++){
    const da=(i-(w.n-1)/2)*w.spread+(P.weapon==='rapid'?rnd(-.05,.05):0);
    bullets.push({x:mx,y:my,vx:Math.cos(a+da)*w.spd,vy:Math.sin(a+da)*w.spd,life:w.life,col:w.col,r:w.r});
  }
  A.sfx(w.snd);
}
function hurtPlayer(src){
  if(P.inv>0||P.dead>0||S.state!=='play')return;
  P.hp--; P.inv=1.4; S.shake=Math.max(S.shake,.3); S.hurt=.35; A.sfx('hurt');
  sparks(P.x,P.y-14,10,'#ff6a5a',160,.4);
  P.vy=-220; P.vx=(P.x<src?-1:1)*150; P.on=false;
  if(P.hp<=0) killPlayer();
}
function killPlayer(){
  if(P.dead>0)return;
  P.dead=1.5; P.lives--; A.sfx('die'); boom(P.x,P.y-14,16,'#ff6a5a'); S.shake=.5; P.weapon='rifle'; P.hp=0;
}
function respawn(){
  let x=camX+70; for(let d=0;d<420;d+=8){if(floorAt(camX+70+d)){x=camX+70+d;break}}
  Object.assign(P,{x,y:-30,vx:0,vy:0,hp:3,inv:2.5,dead:0,weapon:'rifle',on:false,drop:0});
}
function groundX(x){ for(let d=0;d<220;d+=6){ if(floorAt(x+d)) return x+d; } for(let d=0;d<220;d+=6){ if(floorAt(x-d)) return x-d; } return null; }
function spawnFrom(k){
  if(k==='c'){
    let x=camX+VW+26; if(Math.random()<.25&&camX>600) x=camX-26;
    const gx=groundX(x); if(gx==null)return;
    mk('c',gx,GROUND,{face:gx>P.x?-1:1,state:'run'});
  }else if(k==='w'){
    mk('w',camX+VW+24,rnd(90,200),{face:-1});
  }
}
function killEnemy(e){
  if(e.dead)return;
  if(e.type==='boss'){ e.state='dying'; e.at=0; e.bt=0; e.hp=0; S.score+=e.score; A.sfx('roar'); ebullets.length=0; toast('HIVE QUEEN DOWN',2400); return }
  e.dead=true; S.score+=e.score;
  const h=hb(e), cx=h.x+h.w/2, cy=h.y+h.h/2;
  if(e.type==='pod'){
    A.sfx('pod'); boom(cx,cy,10,'#ffb02e');
    pickups.push({x:e.x,y:e.y-14,vx:0,vy:-220,w:14,kind:e.kind,t:0,on:false,drop:0});
  }else{
    A.sfx('kill'); boom(cx,cy,e.type==='swarmer'?8:14,'#9dff4a');
    if(P.hp<3&&Math.random()<.14) pickups.push({x:e.x,y:cy,vx:0,vy:-180,w:14,kind:'H',t:0,on:false,drop:0});
  }
}
function updEnemy(e,dt){
  e.t+=dt; e.anim+=dt*(e.type==='crawler'?10:1); if(e.flash>0)e.flash-=dt;
  const dx=P.x-e.x;
  switch(e.type){
    case'crawler':{
      const dir=Math.sign(dx)||1;
      if(e.state==='wind'){e.vx=0; e.wt-=dt; e.face=dir; if(e.wt<=0){e.state='air';e.vy=-300;e.vx=dir*210;e.on=false}}
      else if(e.state==='air'){ if(e.on){e.state='run';e.cool=1.2+Math.random()} }
      else{
        e.face=dir; let v=dir*e.sp;
        if(e.on&&!groundAt(e.x+dir*(e.w/2+6),e.y)) v=0;
        e.vx=v; e.cool-=dt;
        if(e.on&&e.cool<=0&&Math.abs(dx)<150&&Math.abs(dx)>45){e.state='wind';e.wt=.35}
      }
      phys(e,dt); if(e.y>LH+60)e.dead=true; break;
    }
    case'swarmer':{
      if(e.by===undefined){e.by=e.y;e.ph=Math.random()*6;e.spd=95+Math.random()*30}
      const dir=Math.sign(dx)||-1;
      e.vx+=(dir*e.spd-e.vx)*dt*1.4; e.x+=e.vx*dt; e.by+=((P.y-18)-e.by)*dt*.5; e.y=e.by+Math.sin(e.t*4+e.ph)*26; e.face=Math.sign(e.vx)||dir;
      if(e.x<camX-220||e.x>camX+VW+320) e.dead=true; break;
    }
    case'spitter':{
      e.face=dx>0?1:-1;
      const near=Math.abs(dx)<430&&e.x>camX-10&&e.x<camX+VW+10;
      if(near){ e.cd-=dt; if(e.cd<=0){ spitAt(e); e.cd=2.1+Math.random()*.6 } }
      e.wind=near?clamp(1-e.cd/.6,0,1):0; break;
    }
    case'boss': updBoss(e,dt); break;
  }
}
function spitAt(e){
  const sx=e.x+e.face*6, sy=e.y-24, tx=P.x, ty=P.y-16, T=clamp(Math.abs(tx-sx)/240,.55,1.3), g=500;
  ebullets.push({x:sx,y:sy,vx:(tx-sx)/T,vy:(ty-sy-.5*g*T*T)/T,g,r:5,life:4});

function fan(e){
  const ox=e.x-52, oy=e.y-78, base=Math.atan2(P.y-16-oy,P.x-ox), c=e.phase===2?5:3;
  for(let i=0;i<c;i++){const a=base+(i-(c-1)/2)*.27; ebullets.push({x:ox,y:oy,vx:Math.cos(a)*210,vy:Math.sin(a)*210,g:0,r:5,life:4})}

function updBoss(e,dt){
  e.mouth=Math.max(0,e.mouth-dt*2.5); e.glow=Math.max(0,e.glow-dt*1.5);
  if(e.state==='dying'){
    e.at+=dt; e.bt-=dt; S.shake=Math.max(S.shake,.55);
    if(e.bt<=0){e.bt=.11; boom(e.x+rnd(-45,45),e.y-rnd(10,100),rnd(10,20),pick(['#ffb02e','#9dff4a','#ff6a5a'])); A.sfx('boom')}
    if(e.at>=3){ boom(e.x,e.y-60,46,'#ffd27a'); A.sfx('boom'); e.dead=true; boss=null; S.winT=1.4; S.shake=1 }
    return;
  }
  if(e.hp<e.max*.5&&e.phase!==2){e.phase=2; toast('THE QUEEN IS ENRAGED',1800,true); A.sfx('roar'); S.shake=.8}
  const sp=e.phase===2?1.35:1; e.face=-1;
  switch(e.state){
    case'enter': e.x-=70*dt; S.shake=Math.max(S.shake,.12); if(e.x<=e.base){e.x=e.base;e.state='idle';e.cd=1;A.sfx('roar');S.shake=.7} break;
    case'idle':{
      e.x+=((e.base+Math.sin(e.t*.9)*50)-e.x)*Math.min(1,dt*3);
      e.cd-=dt*sp;
      if(e.cd<=0){
        let k=pick(['spit','spit','summon','charge']); if(k===e.last) k=pick(['spit','summon','charge']);
        e.last=k; e.state=k; e.at=0; e.n=0; e.did=false;
        if(k==='charge') A.sfx('charge');
      } break;
    }
    case'spit':{
      e.at+=dt; e.mouth=Math.max(e.mouth,Math.min(1,e.at*2));
      const total=e.phase===2?3:2;
      if(e.n<total&&e.at>=.6+e.n*.55){fan(e);e.n++}
      if(e.n>=total&&e.at>=.6+total*.55){e.state='idle';e.cd=1.5} break;
    }
    case'summon':{
      e.at+=dt; e.glow=1; e.mouth=Math.min(1,e.at*2);
      if(!e.did&&e.at>=.8){
        e.did=true; A.sfx('roar');
        for(let i=0;i<2;i++) mk('c',e.x-70-i*26,GROUND,{state:'air',vx:-170-i*30,vy:-230,face:-1,sp:85});
        if(e.phase===2) for(let i=0;i<2;i++) mk('w',camX+VW+16,rnd(90,170),{face:-1});
      }
      if(e.at>=1.5){e.state='idle';e.cd=1.6} break;
    }
    case'charge':{
      e.at+=dt; e.glow=1; e.x+=Math.sin(e.at*70)*.6; S.shake=Math.max(S.shake,.1);
      if(e.at>=.9){e.state='dash';e.at=0} break;
    }
    case'dash':{
      e.x-=(e.phase===2?400:340)*dt;
      if(e.x<=ARENA+70){e.x=ARENA+70;e.state='stun';e.at=0;S.shake=.9;A.sfx('boom');sparks(e.x-50,e.y-60,16,'#ffb02e',200,.5)} break;
    }
    case'stun': e.at+=dt; if(e.at>=.8) e.state='back'; break;
    case'back': e.x+=130*dt; if(e.x>=e.base){e.x=e.base;e.state='idle';e.cd=1.2} break;
  }
}

  for(let i=spawnQ.length-1;i>=0;i--){ spawnQ[i].t-=dt; if(spawnQ[i].t<=0){spawnFrom(spawnQ[i].k); spawnQ.splice(i,1)} }

    if(rm) ebullets.splice(i,1);
  }

  if(P.dead<=0&&P.inv<=0){ const pb=pbox(); for(const e of enemies){ if(e.dead||e.type==='pod'||e.type==='spitter'&&false||e.state==='dying')continue; if(ov2(pb,hb(e))){hurtPlayer(e.x);break} } }

  for(let i=parts.length-1;i>=0;i--){const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue}

}

const FL=(e,c)=>e.flash>0?'#ffffff':c;

function drawEnemy(e){

function drawParticles(){

function render(){

/* ================= main loop ================= */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(ts-last)/1000||0); last=ts; dtG=dt;
  if(S.state==='play'){update(dt); updHud()} else if(S.state==='title') updTitle(dt);

}
function boot(){
  layout(); resetLevel(0); S.state='title'; showTitle(); requestAnimationFrame(frame);

if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
