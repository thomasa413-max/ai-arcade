function getLang() {
  if (typeof location !== 'undefined' && location.search) {
    var m = /(?:^|[?&])lang=([a-zA-Z-]{2,5})/.exec(location.search);
    if (m) {
      var code = m[1].toLowerCase().split('-')[0];
      if (STRINGS[code]) return code;
    }
  }
  return 'en';
}
var LANG = getLang();
function T(key) {
  var s = STRINGS[LANG] || STRINGS.en;
  return s[key] !== undefined ? s[key] : (STRINGS.en[key] !== undefined ? STRINGS.en[key] : key);
}
function Tf(key, vars) {
  var s = T(key);
  for (var k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}
function isRTL() { return (STRINGS[LANG] && STRINGS[LANG].dir) === 'rtl'; }

   ============================================================ */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
function dist(a, b) { return Math.abs(a.x - b.x); }

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// easing
var EASE = {
  linear: function (t) { return t; },
  io: function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; },
  out: function (t) { return 1 - Math.pow(1 - t, 3); },
  in: function (t) { return t * t * t; },
  snap: function (t) { return t < 0.6 ? (t / 0.6) * 0.15 : 0.15 + Math.pow((t - 0.6) / 0.4, 2) * 0.85; },
  back: function (t) { var c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

    if (b[1] && b[1].pressed) pad.hk = 1;      // B / circle

function buildAttackAnims() {

    var w = kf(m.startup, P(pk.windup), pk.windEase || 'out');
    var frames;
    if (pk.strike2 && m.multi) {
      var half = Math.floor(m.active / 2);
      frames = [w,
        kf(half, P(pk.strike), 'snap'),
        kf(m.active - half, P(pk.strike2), 'snap'),
        kf(m.recovery, P(BASE_POSE), 'io')];
    } else {
      frames = [w, kf(m.active, P(pk.strike), 'snap'), kf(m.recovery, P(pk.recover ? pk.recover : BASE_POSE), 'io')];
    }
    ANIMS[id] = anim(frames, false);
  }
}

/* ---- pose interpolation ---- */
var POSE_KEYS = Object.keys(BASE_POSE);
var scratchPose = {};
function lerpPose(a, b, t, out) {
  for (var i = 0; i < POSE_KEYS.length; i++) {
    var k = POSE_KEYS[i];
    out[k] = a[k] + (b[k] - a[k]) * t;
  }
  return out;
}

function AnimPlayer() { this.name = ''; this.t = 0; }
AnimPlayer.prototype.set = function (name) {
  if (this.name !== name) { this.name = name; this.t = 0; }
};
AnimPlayer.prototype.update = function () { this.t++; };
AnimPlayer.prototype.pose = function (out) {
  var A = ANIMS[this.name] || ANIMS.idle;
  var frames = A.frames;
  var total = 0, i;
  for (i = 0; i < frames.length; i++) total += frames[i].d;
  var t = A.loop ? (total > 0 ? this.t % total : 0) : Math.min(this.t, total - 0.001);
  var acc = 0, idx = 0;
  for (i = 0; i < frames.length; i++) {
    if (t < acc + frames[i].d) { idx = i; break; }
    acc += frames[i].d;
    idx = i;
  }
  var f = frames[idx];
  var local = clamp((t - acc) / f.d, 0, 1);
  var next = frames[idx + 1] ? frames[idx + 1].p : f.p;
  return lerpPose(f.p, next, EASE[f.e || 'io'](local), out);
};

Fighter.prototype.hurtbox = function (out) {
  var d;
  if (!this.onGround) d = HURT.air;
  else if (this.state === 'crouch' || this.state === 'crouchBlock' || ((this.state === 'attack' || this.state === 'hitstun') && this.moveId && this.crouchAttack)) d = HURT.crouch;
  else d = HURT.stand;
  if (this.state === 'knockdown' || this.state === 'ko' || (this.state === 'thrown' && this.stateFrame > 10)) {
    out.x = this.x - 110; out.y = this.y - 60; out.w = 220; out.h = 60;
  } else if (d === HURT.crouch) {
    out.x = this.x - d.w / 2; out.y = this.y - d.h; out.w = d.w; out.h = d.h;
  } else {
    out.x = this.x - d.w / 2; out.y = this.y - d.h; out.w = d.w; out.h = d.h;
  }
  return out;
};

Fighter.prototype.hitbox = function (out) {
  var m = this.move;
  if (!m || this.state !== 'attack') return null;
  var t = this.stateFrame;
  if (t < m.startup || t >= m.startup + m.active) return null;
  var b = m.box;
  out.x = this.facing === 1 ? this.x + b.x : this.x - b.x - b.w;

Fighter.prototype.tryActions = function (world, foe, pad, pr) {
  var lpPressed = pr.lp, lkPressed = pr.lk;
  var lpInBuf = pressedWithin(this.idx, 'lp', 3), lkInBuf = pressedWithin(this.idx, 'lk', 3);
  if ((lpPressed && lkInBuf) || (lkPressed && lpInBuf)) {
    if (dist(this, foe) < THROW_RANGE && foe.onGround && foe.state !== 'hitstun' && foe.state !== 'knockdown' && foe.state !== 'thrown' && foe.state !== 'ko') {
      this.startAttack(world, 'throw');
      return true;
    }
  }
  if (pr.sup && this.meter >= CFG.MAX_METER && (pr.hp || pressedWithin(this.idx, 'hp', 4))) {
    return this.startAttack(world, SPECIAL_MAP[this.charId].super);
  }
  if (pr.sup && this.meter >= CFG.MAX_METER) {
    return this.startAttack(world, SPECIAL_MAP[this.charId].super);
  }
  if ((pr.sp && pr.hp) && this.meter >= CFG.MAX_METER) {
    return this.startAttack(world, SPECIAL_MAP[this.charId].super);
  }
  if (pr.sp) {
    return this.startAttack(world, this.chooseSpecial(pad, foe));
  }
  if (pr.hp) return this.startAttack(world, pad.down ? 'chp' : 'hp');
  if (pr.hk) return this.startAttack(world, pad.down ? 'chk' : 'hk');
  if (pr.lp) return this.startAttack(world, pad.down ? 'clp' : 'lp');

Fighter.prototype.groundNeutral = function (world, foe, pad, pr, canAct) {
  var fwd = this.facing;
  var holdingBack = (pad.left && fwd === 1) || (pad.right && fwd === -1) || pad.blk;
  var holdingFwd = (pad.right && fwd === 1) || (pad.left && fwd === -1);
  this.blocking = false;

  if (this.blockstunTimer > 0) {
    this.blockstunTimer--;
    this.blocking = true;
    this.vx = 0;
    this.state = pad.down ? 'crouchBlock' : 'block';
    this.anim.set(this.state);
    return;
  }
  if (!canAct) { this.vx *= 0.6; this.state = 'idle'; this.anim.set('idle'); return; }

  // dash: double-tap forward/back
  if (pr.left || pr.right) {
    var dir = pr.right ? 1 : -1;
    if (this.dashTap.dir === dir && this.dashTap.t > 0) {
      this.state = 'dash'; this.stateFrame = 0;
      this.vx = dir * (this.char.walk * 2.3);
      this.dashTap.dir = 0; this.dashTap.t = 0;
      this.dashBack = dir !== fwd;
      Audio2.sfx('dash');
      Effects.dust(this.x, CFG.FLOOR, 6);
      return;
    }
    this.dashTap.dir = dir; this.dashTap.t = 13;
  }
  if (this.dashTap.t > 0) this.dashTap.t--;

  if (this.tryActions(world, foe, pad, pr)) return;

  if (pad.up) { this.startJump(pad); return; }
  if (pad.down) {
    this.state = holdingBack ? 'crouchBlock' : 'crouch';
    this.blocking = holdingBack;
    this.vx = 0;
    this.anim.set(this.state);
    return;
  }
  if (pad.blk && !holdingFwd) {
    this.state = 'block'; this.blocking = true; this.vx = 0;
    this.anim.set('block');
    return;
  }
  if (holdingFwd) {
    this.state = 'walk'; this.vx = this.char.walk * fwd;
    this.blocking = false;
    this.anim.set('walkF');
  } else if (holdingBack) {
    this.state = 'walk'; this.vx = -this.char.backWalk * fwd;
    this.blocking = true;
    this.anim.set('walkB');
  } else {
    this.state = 'idle'; this.vx = 0;
    this.anim.set('idle');
  }
};

Fighter.prototype.attackUpdate = function (world, foe, pad, pr) {
  var m = this.move;
  if (!m) { this.setIdle(); return; }
  var t = this.stateFrame;
  if (m.vyJump && t === m.startup) {
    this.vy = m.vyJump; this.onGround = false;
    Audio2.sfx('dash');
    Effects.dust(this.x, CFG.FLOOR, 6);
  }
  if (m.travel && t >= m.startup && t < m.startup + m.active) {
    this.x += m.travel * this.facing;
    if (this.stateFrame % 2 === 0) Effects.dust(this.x - this.facing * 30, CFG.FLOOR, 1);
  }
  if (m.projectile && t === m.startup) {
    spawnProjectile(world, this, m);
  }
  if (t === m.startup) Audio2.sfx(m.isSuper ? 'super' : (m.damage >= 50 ? 'whooshH' : 'whoosh'));

  if (this.connected && this.onGround && !m.isSuper) {
    var to = this.readCancel(pad, pr, m);
    if (to) { this.startAttack(world, to); return; }
  }
  if (t >= moveTotal(m)) {
    if (!this.onGround) {
      this.state = 'jump'; this.stateFrame = 0;
    } else {
      this.setIdle();
    }
  }
};

Fighter.prototype.hitstunUpdate = function (world) {
  this.vx *= 0.86;
  if (this.stateFrame >= this.stunDur) this.setIdle();
};

Fighter.prototype.knockdownUpdate = function (world) {
  if (this.onGround) {
    this.vx *= 0.7;
    this.lieTimer++;
    if (this.lieTimer === 1) {
      Audio2.sfx('knockdown');
      Effects.dust(this.x, CFG.FLOOR, 8);
      world.shake = Math.max(world.shake, 4);
    }
    if (this.lieTimer > 42) {
      this.state = 'getup'; this.stateFrame = 0;
      this.invuln = CFG.GETUP_INVULN;
      this.anim.set('getup');
    }
  }
};

Fighter.prototype.thrownUpdate = function (world) {
  if (this.throwEscape > 0) {
    this.throwEscape--;
    var pr = Input.pressed[this.idx];
    if (pr && (pr.lp || pr.lk)) {
      this.setIdle();
      this.vx = -this.facing * 6;
      Audio2.sfx('whoosh');
      Effects.ring(this.x, this.y - 150, 40, '#9be8ff');
      return;
    }
    if (this.stateFrame > 14) {
      this.vx = -this.facing * 7;
      this.vy = -9.5;
      this.onGround = false;
      this.throwEscape = 0;
      this.state = 'knockdown'; this.stateFrame = 0; this.lieTimer = 0;
    }
  }
};

Fighter.prototype.koUpdate = function (world) {
  if (this.onGround) this.vx *= 0.8;
};

Fighter.prototype.dashUpdate = function (world, pad) {
  if (this.stateFrame > 13) { this.setIdle(); }
};

Fighter.prototype.update = function (world, foe) {
  this.px = this.x; this.py = this.y;
  this.stateFrame++;
  if (this.invuln > 0) this.invuln--;
  if (this.flash > 0) this.flash--;
  if (this.blockFlash > 0) this.blockFlash--;
  if (this.exprT > 0) this.exprT--; else this.expr = '';
  if (this.comboTimer > 0) { this.comboTimer--; if (this.comboTimer === 0) this.comboHits = 0; }
  if (this.ghostHp > this.hp) this.ghostHp = Math.max(this.hp, this.ghostHp - 0.3);
  else this.ghostHp = this.hp;
  this.blink--;
  if (this.blink <= 0) { this.blinkT = 6; this.blink = rndi(90, 300); }
  if (this.blinkT > 0) this.blinkT--;

  var pad = Input.pads[this.idx];
  var pr = Input.pressed[this.idx];
  var canAct = world.inputEnabled();

  // facing with cross-up grace
  if (this.onGround && foe && ['attack', 'hitstun', 'knockdown', 'thrown', 'ko', 'getup', 'throw', 'victory'].indexOf(this.state) < 0) {
    var want = foe.x >= this.x ? 1 : -1;
    if (want !== this.facing) {
      this.crossTimer++;
      if (this.crossTimer > 6) { this.facing = want; this.crossTimer = 0; }
    } else this.crossTimer = 0;
  }

  switch (this.state) {
    case 'idle': case 'walk': case 'crouch': case 'block': case 'crouchBlock': case 'land':
      if (this.state === 'land' && this.stateFrame < 8) { this.vx *= 0.7; this.anim.set('land'); break; }
      this.groundNeutral(world, foe, pad, pr, canAct);
      break;
    case 'jump':
      if (canAct && !this.airAttacked && (pr.lp || pr.hp)) { this.startAttack(world, 'jp'); this.airAttacked = true; }
      else if (canAct && !this.airAttacked && (pr.lk || pr.hk)) { this.startAttack(world, 'jk'); this.airAttacked = true; }
      else this.anim.set(this.vy < 0 ? 'jumpRise' : 'jumpFall');
      break;
    case 'dash':
      if (this.stateFrame > 13) this.setIdle();
      break;
    case 'attack': case 'throw':
      this.attackUpdate(world, foe, pad, pr);
      break;
    case 'hitstun': this.hitstunUpdate(world); break;
    case 'knockdown': this.knockdownUpdate(world); break;
    case 'getup':
      if (this.stateFrame >= 22) this.setIdle();
      break;
    case 'thrown': this.thrownUpdate(world); break;
    case 'ko': this.koUpdate(world); break;
    case 'victory': this.vx = 0; break;
  }

  // physics
  if (!this.onGround) this.vy += CFG.GRAVITY;
  this.x += this.vx;
  this.y += this.vy;
  var minX = CFG.WALL, maxX = CFG.STAGE_W - CFG.WALL;
  if (this.x < minX) { this.x = minX; if (this.vx < 0) this.vx = 0; }
  if (this.x > maxX) { this.x = maxX; if (this.vx > 0) this.vx = 0; }
  if (this.y >= CFG.FLOOR) {
    if (!this.onGround) {
      this.onGround = true;
      this.y = CFG.FLOOR; this.vy = 0;
      if (this.state === 'knockdown' || this.state === 'thrown' || this.state === 'ko') {
        this.state = this.state === 'ko' ? 'ko' : 'knockdown';
        if (this.state === 'knockdown') { this.stateFrame = 0; this.lieTimer = 0; }
        this.vx *= 0.4;
        Audio2.sfx('land');
        Effects.dust(this.x, CFG.FLOOR, 10);
        world.shake = Math.max(world.shake, 5);
      } else {
        if (this.state === 'attack') { this.state = 'land'; this.stateFrame = 0; this.move = null; this.moveId = null; }
        else if (this.state !== 'land') { this.state = 'land'; this.stateFrame = 0; }
        Audio2.sfx('land');
        Effects.dust(this.x, CFG.FLOOR, 4);
      }
    }
  }

  // body push: fighters cannot overlap
  if (foe && this.onGround && foe.onGround) {
    var d = foe.x - this.x;
    var minD = 76;
    if (Math.abs(d) < minD) {
      var push = (minD - Math.abs(d)) / 2 * sign(d || 1);
      this.x -= push; foe.x += push;
      this.x = clamp(this.x, minX, maxX); foe.x = clamp(foe.x, minX, maxX);
    }
  }

  this.anim.update();
  this.updateHair();
};

Fighter.prototype.updateHair = function () {
  var headBack = this.headAnchor();
  var pts = this.hairPts;
  var ax = headBack.x - this.facing * 10, ay = headBack.y + 6;
  var prevX = ax, prevY = ay;
  for (var i = 0; i < pts.length; i++) {
    var p = pts[i];
    var tx = prevX - this.facing * 13;
    var ty = prevY + 7 + Math.sin(world ? world.frame * 0.1 + i : 0) * 1.5;
    p.x += (tx - p.x) * 0.28;
    p.y += (ty - p.y) * 0.28;
    p.x -= this.vx * 0.22;
    p.y += clamp(this.vy * -0.12, -3, 3);
    prevX = p.x; prevY = p.y;
  }
};

Fighter.prototype.headAnchor = function () {
  // approximated head position for hair anchor / effects
  var h = this.hyOffset();
  return { x: this.x + this.facing * 6, y: this.y - BONE.hipH + h - BONE.torso - 8 };
};

Fighter.prototype.hyOffset = function () {
  var p = this.animPose || BASE_POSE;
  return p.hy || 0;
};

/* ---- hit resolution ---- */
var _hb = {}, _ub = {};
function blockCovers(height, defender) {
  var crouching = defender.state === 'crouchBlock' || (defender.blocking && padDown(defender));
  if (height === 'low') return crouching;
  if (height === 'high') return !crouching;
  return true;
}
function padDown(f) { return Input.pads[f.idx].down === 1; }

function resolveAttacks(world) {
  if (!world.inputEnabled()) return;
  var a = world.fighters[0], b = world.fighters[1];
  tryAttack(world, a, b);
  tryAttack(world, b, a);
}

function tryAttack(world, atk, def) {
  if (atk.state !== 'attack') return;
  var m = atk.move;
  if (!m || m.projectile) return;
  var t = atk.stateFrame;
  if (t < m.startup || t >= m.startup + m.active) return;
  if (m.multi) {
    if (atk.multiHits >= m.multi.hits) return;
    if ((t - m.startup) % m.multi.interval !== 0) return;
  } else if (atk.hasHit) return;
  var hb = atk.hitbox(_hb);
  if (!hb) return;
  var ub = def.hurtbox(_ub);
  if (!rectsOverlap(hb.x, hb.y, hb.w, hb.h, ub.x, ub.y, ub.w, ub.h)) return;
  if (m.multi) atk.multiHits++; else atk.hasHit = true;
  var hx = clamp(def.x, hb.x, hb.x + hb.w);
  var hy = clamp(def.y - 130, hb.y, hb.y + hb.h);
  resolveHit(world, atk, def, m, hx, hy, false);
}

function resolveHit(world, atk, def, m, hx, hy, isProj) {
  var dir = sign(def.x - atk.x) || atk.facing;
  var blocked = def.blocking && !m.unblockable && blockCovers(m.height, def);
  if (def.state === 'ko') return;
  if (blocked) {
    var chip = (m.projectile || m.isSuper || m.travel || m.multi) ? Math.round(m.damage * CHIP_RATIO) : 0;
    def.hp = Math.max(0, def.hp - chip);
    def.blockstunTimer = m.blockstun;
    def.blockFlash = 8;
    def.vx = m.push * 0.7 * dir;
    if ((dir === 1 && def.x >= CFG.STAGE_W - CFG.WALL - 4) || (dir === -1 && def.x <= CFG.WALL + 4)) {
      atk.vx = -m.push * dir * 0.8;
    }
    atk.connected = true;
    atk.meter = Math.min(CFG.MAX_METER, atk.meter + Math.round(m.meter * 0.5));
    def.meter = Math.min(CFG.MAX_METER, def.meter + 3);
    world.hitstop = Math.max(world.hitstop, Math.ceil(m.hitstop * 0.6));
    Audio2.sfx('block');
    Effects.blockSpark(hx, hy);
    if (def.hp <= 0) world.startKO(atk, def);
    return;
  }
  var continuing = def.state === 'hitstun' || def.state === 'thrown' || (!def.onGround && def.state === 'knockdown');
  atk.comboHits = continuing ? atk.comboHits + 1 : 1;
  atk.comboTimer = 60;
  var scale = Math.max(0.4, 1 - 0.1 * (atk.comboHits - 1));
  var dmg = Math.max(1, Math.round(m.damage * scale));
  def.hp = Math.max(0, def.hp - dmg);
  world.roundDamage[atk.idx] += dmg;
  atk.meter = Math.min(CFG.MAX_METER, atk.meter + m.meter);
  def.meter = Math.min(CFG.MAX_METER, def.meter + Math.round(dmg * 0.5));
  atk.connected = true;
  def.flash = 8;
  def.blocking = false;
  def.blockstunTimer = 0;
  world.hitstop = Math.max(world.hitstop, m.hitstop);
  if (m.hitstopShake) world.shake = Math.max(world.shake, m.hitstopShake);
  if (m.damage >= 50 || m.isSuper) {
    world.shake = Math.max(world.shake, m.isSuper ? (m.shake || 6) : 7);
    Effects.impactBig(hx, hy, dir);
    Audio2.sfx('hitH');
  } else {
    Effects.impactSmall(hx, hy, dir);
    Audio2.sfx('hitL');
  }
  Effects.damageNumber(hx, hy - 30, dmg);
  if (def.hp <= 0) { world.startKO(atk, def); return; }
  var kd = m.kd;
  if (m.multi) kd = atk.multiHits >= m.multi.hits;
  if (kd) {
    def.state = 'knockdown'; def.stateFrame = 0; def.lieTimer = 0;
    def.vx = dir * 5.5; def.vy = -7.5; def.onGround = false;
    def.anim.set('knockdown');
  } else {
    def.state = 'hitstun'; def.stateFrame = 0;
    def.stunDur = m.hitstun;
    def.vx = dir * m.push * 0.9;
    if (!def.onGround) def.vy = -4;
    def.anim.set(m.height === 'low' ? 'hitLow' : 'hitHigh');
    def.setExpr('hit', m.hitstun);
  }
}

/* ============================================================
   SECTION: PROJECTILES
   ============================================================ */
function spawnProjectile(world, f, m) {
  var ps = world.projectiles;
  for (var i = 0; i < ps.length; i++) {
    if (ps[i].owner === f.idx && !ps[i].dead) return;
  }
  var pd = m.projectile;
  ps.push({
    owner: f.idx, moveId: f.moveId,
    x: f.x + f.facing * 70, y: CFG.FLOOR + pd.yOff,
    vx: f.facing * pd.speed, w: pd.w, h: pd.h,
    type: pd.type, life: 150, dead: false, t: 0
  });
  Audio2.sfx(pd.type === 'quake' ? 'quake' : 'proj');
  if (pd.type === 'quake') world.shake = Math.max(world.shake, 6);
}

function updateProjectiles(world) {
  var ps = world.projectiles;
  for (var i = 0; i < ps.length; i++) {
    var p = ps[i];
    if (p.dead) continue;
    p.t++;
    p.x += p.vx;
    p.life--;
    if (p.life <= 0 || p.x < 20 || p.x > CFG.STAGE_W - 20) { p.dead = true; continue; }
    var foe = world.fighters[1 - p.owner];
    var atk = world.fighters[p.owner];
    if (foe.state !== 'ko' && (world.phase === 'fight' || world.phase === 'intro')) {
      var m = MOVES[p.moveId];
      var ub = foe.hurtbox(_ub);
      if (rectsOverlap(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, ub.x, ub.y, ub.w, ub.h)) {
        p.dead = true;
        resolveHit(world, atk, foe, m, p.x, p.y, true);
        Effects.projBurst(p.x, p.y, p.type);
        continue;
      }
    }
    for (var j = 0; j < ps.length; j++) {
      var q = ps[j];
      if (q === p || q.dead || q.owner === p.owner) continue;
      if (rectsOverlap(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, q.x - q.w / 2, q.y - q.h / 2, q.w, q.h)) {
        p.dead = true; q.dead = true;
        Effects.projBurst((p.x + q.x) / 2, (p.y + q.y) / 2, 'clash');
        Audio2.sfx('projHit');
      }
    }
  }
  for (var k = ps.length - 1; k >= 0; k--) if (ps[k].dead) ps.splice(k, 1);
}

/* ============================================================
   SECTION: MATCH / WORLD
   ============================================================ */
function createWorld() {
  return {
    frame: 0, phase: 'intro', phaseTimer: 135,
    round: 1, timer: CFG.ROUND_SECONDS * 60,
    fighters: [], projectiles: [], particles: [],
    hitstop: 0, slowmo: 1, shake: 0,
    camX: CFG.W / 2, camZoom: 1, camZoomT: 1,
    cineTimer: 0, cineFighter: null,
    koTimer: 0, roundEndTimer: 0, roundEndMsg: '', perfect: -1,
    drawReplay: 0, roundDamage: [0, 0],
    mode: 'cpu', difficulty: 1,
    winner: -1, matchOver: false, koText: 0
  };
}

function setupFighters(world, c1, c2, mirror) {
  var mid = CFG.STAGE_W / 2;
  world.fighters[0] = new Fighter(c1, 0, mid - CFG.FIGHTER_DIST / 2, 1, false);
  world.fighters[1] = new Fighter(c2, 1, mid + CFG.FIGHTER_DIST / 2, -1, mirror && c1 === c2);
}

var world = null;
var aiControllers = [null, null];

function newWorld() {
  var w = createWorld();
  w.inputEnabled = worldInputEnabled;
  w.startSuperCine = worldStartSuperCine;
  w.startKO = worldStartKO;
  w.endRound = worldEndRound;
  w.matchDecided = worldMatchDecided;
  w.startRound = worldStartRound;
  w.update = worldUpdate;
  w.timeUp = worldTimeUp;
  return w;
}

function worldInputEnabled() {
  return (this.phase === 'fight') || (this.phase === 'intro' && this.phaseTimer <= 45);
};

function worldStartSuperCine(f) {
  this.cineTimer = 25;
  this.cineFighter = f;
  Audio2.sfx('super');
};

function worldStartKO(winner, loser) {
  if (this.phase !== 'fight') return;
  this.phase = 'ko';
  this.koTimer = CFG.KO_SLOWMO_FRAMES;
  this.slowmo = CFG.KO_SLOWMO_SCALE;
  this.koText = 130;
  this.pendingWinner = winner.idx;
  loser.state = 'ko'; loser.stateFrame = 0;
  loser.vx = sign(loser.x - winner.x || winner.facing) * 4.5;
  loser.vy = -8.5; loser.onGround = false;
  loser.blocking = false;
  loser.anim.set('knockdown');
  loser.setExpr('ko', 200);
  Audio2.sfx('ko');
  this.shake = 12;
};

function worldEndRound(winnerIdx, msg) {
  this.phase = 'roundEnd';
  this.roundEndTimer = 170;
  this.roundEndMsg = msg;
  this.slowmo = 1;
  this.perfect = -1;
  if (winnerIdx >= 0) {
    var w = this.fighters[winnerIdx];
    w.roundWins++;
    if (w.hp >= CFG.MAX_HP) this.perfect = winnerIdx;
    if (w.state !== 'ko' && w.state !== 'knockdown' && w.state !== 'hitstun') {
      w.state = 'victory'; w.stateFrame = 0; w.anim.set('victory');
    }
  }
  this.roundWinner = winnerIdx;
};

function worldMatchDecided() {
  for (var i = 0; i < 2; i++) if (this.fighters[i].roundWins >= CFG.ROUNDS_TO_WIN) return i;
  return -1;
};

function worldStartRound(n) {
  this.round = n;
  this.phase = 'intro'; this.phaseTimer = 135;
  this.timer = CFG.ROUND_SECONDS * 60;
  this.projectiles.length = 0;
  this.particles.length = 0;
  this.hitstop = 0; this.slowmo = 1; this.shake = 0;
  this.cineTimer = 0; this.roundDamage = [0, 0];
  this.koText = 0;
  var mid = CFG.STAGE_W / 2;
  for (var i = 0; i < 2; i++) {
    var f = this.fighters[i];
    f.x = i === 0 ? mid - CFG.FIGHTER_DIST / 2 : mid + CFG.FIGHTER_DIST / 2;
    f.px = f.x; f.y = CFG.FLOOR; f.py = f.y;
    f.vx = 0; f.vy = 0; f.onGround = true;
    f.hp = CFG.MAX_HP; f.ghostHp = CFG.MAX_HP;
    f.state = 'idle'; f.stateFrame = 0;
    f.move = null; f.moveId = null;
    f.blocking = false; f.blockstunTimer = 0;
    f.comboHits = 0; f.comboTimer = 0;
    f.invuln = 0; f.flash = 0;
    f.anim.set('idle');
    f.facing = i === 0 ? 1 : -1;
  }
};

function clearAIPads() {
  if (!Input.aiPads) return;
  for (var i = 0; i < 2; i++) {
    if (Input.aiPads[i]) for (var k in Input.aiPads[i]) Input.aiPads[i][k] = 0;
  }
}

function worldUpdate() {
  this.frame++;
  if (this.cineTimer > 0) {
    this.cineTimer--;
    if (this.cineTimer === 0 && this.cineFighter) {
      var id = this.cineFighter.superPending;
      this.cineFighter.superPending = null;
      this.cineFighter.startAttack(this, id, true);
      this.shake = 6;
    }
    Effects.update(this);
    Camera.update(this);
    return;
  }
  if (this.hitstop > 0) {
    this.hitstop--;
    Effects.update(this);
    Camera.update(this);
    return;
  }

  var active = this.inputEnabled();
  if (this.phase === 'fight' && active) {
    for (var i = 0; i < 2; i++) {
      if (this.fighters[i].ctrl === 'cpu' && aiControllers[i]) {
        aiControllers[i].update(this);
      }
    }
  } else {
    clearAIPads();
  }

  var a = this.fighters[0], b = this.fighters[1];
  a.update(this, b);
  b.update(this, a);
  if (this.phase === 'fight' || this.phase === 'ko' || this.phase === 'roundEnd') resolveAttacks(this);
  updateProjectiles(this);
  Effects.update(this);
  Camera.update(this);

  switch (this.phase) {
    case 'intro':
      this.phaseTimer--;
      if (this.phaseTimer === 90) Audio2.sfx('gong');
      if (this.phaseTimer === 45) Audio2.sfx('fight');
      if (this.phaseTimer <= 0) this.phase = 'fight';
      break;
    case 'fight':
      this.timer--;
      if (this.timer === 600) Audio2.sfx('beep');
      if (this.timer <= 600 && this.timer % 60 === 0 && this.timer > 0) Audio2.sfx('beep');
      if (this.timer <= 0) this.timeUp();
      break;
    case 'ko':
      this.koTimer--;
      if (this.koText > 0) this.koText--;
      if (this.koTimer <= 0) {
        var wIdx = this.fighters[0].hp <= 0 && this.fighters[1].hp <= 0 ? -1 : (this.fighters[0].hp <= 0 ? 1 : 0);
        this.endRound(wIdx, wIdx < 0 ? T('draw') : '');
      }
      break;
    case 'roundEnd':
      this.roundEndTimer--;
      if (this.roundEndTimer <= 0) {
        var mIdx = this.matchDecided();
        if (mIdx >= 0) {
          this.winner = mIdx;
          this.matchOver = true;
        } else {
          var nextRound = this.roundWinner < 0 ? this.round : this.round + 1;
          if (this.roundWinner < 0) this.drawReplay++;
          this.startRound(nextRound);
        }
      }
      break;
  }
};

function worldTimeUp() {
  var a = this.fighters[0], b = this.fighters[1];
  if (a.hp === b.hp) {
    if (this.drawReplay >= 1) {
      var idx = this.roundDamage[0] > this.roundDamage[1] ? 0 : (this.roundDamage[1] > this.roundDamage[0] ? 1 : 0);
      this.endRound(idx, T('draw'));
    } else {
      this.endRound(-1, T('draw'));
    }
  } else {
    var wIdx = a.hp > b.hp ? 0 : 1;
    this.endRound(wIdx, T('timeUp'));
  }
};


/* ============================================================
   SECTION: AI
   Reads only public game state, presses virtual buttons.
   difficulty: 0 easy, 1 medium, 2 hard
   ============================================================ */
var AI_PARAMS = [
  { reaction: 25, block: 0.30, aggr: 0.35, err: 0.35, specialUse: 0.30, superUse: 0.40, throwUse: 0.05, antiAir: 0.35, script: ['lp', 'lk'] },
  { reaction: 14, block: 0.55, aggr: 0.60, err: 0.15, specialUse: 0.60, superUse: 0.70, throwUse: 0.15, antiAir: 0.55, script: ['lp', 'hp', null, 'sp1'] },
  { reaction: 7,  block: 0.75, aggr: 0.85, err: 0.05, specialUse: 0.85, superUse: 0.90, throwUse: 0.25, antiAir: 0.75, script: ['lp', 'hp', 'hk', null, 'sp2'] }
];

function AIController(idx, difficulty) {
  this.idx = idx;
  this.diff = clamp(difficulty, 0, 2);
  if (!Input.aiPads) Input.aiPads = [makePad(), makePad()];
  if (!Input.aiPads[idx]) Input.aiPads[idx] = makePad();
  this.pad = Input.aiPads[idx];
  this.reactTimer = rndi(5, 20);
  this.plan = { type: 'wait', timer: 10 };
  this.foeBlockFrames = 0;
  this.scriptT = 0;
}

AIController.prototype.update = function (world) {
  var pad = this.pad;
  for (var k in pad) pad[k] = 0;
  var me = world.fighters[this.idx], foe = world.fighters[1 - this.idx];
  if (!me || !foe) return;
  if (!world.inputEnabled() || me.state === 'ko' || me.state === 'hitstun' ||
      me.state === 'knockdown' || me.state === 'thrown' || me.state === 'getup') {
    this.plan = { type: 'wait', timer: 4 };
    return;
  }
  if (foe.blocking) this.foeBlockFrames++; else this.foeBlockFrames = Math.max(0, this.foeBlockFrames - 2);

  if (this.plan.type === 'combo') {
    this.runScript(world, me, foe, pad);
    return;
  }
  if (this.plan.timer > 0) {
    this.plan.timer--;
    this.exec(world, me, foe, pad);
    return;
  }
  var P = AI_PARAMS[this.diff];
  this.reactTimer--;
  if (this.reactTimer > 0) { this.exec(world, me, foe, pad); return; }
  this.reactTimer = P.reaction + rndi(0, 6);
  this.decide(world, me, foe, P);
  this.exec(world, me, foe, pad);
};

AIController.prototype.decide = function (world, me, foe, P) {
  var d = Math.abs(me.x - foe.x);
  var dir = sign(foe.x - me.x) || 1;
  var roll = Math.random();
  var foeAttacking = foe.state === 'attack' && foe.move;
  var foeRecovery = foeAttacking && foe.stateFrame > foe.move.startup + foe.move.active;
  var foeStartup = foeAttacking && foe.stateFrame <= foe.move.startup;
  var proj = null;
  for (var i = 0; i < world.projectiles.length; i++) {
    var p = world.projectiles[i];
    if (p.owner !== this.idx && sign(me.x - p.x) === sign(p.vx) && Math.abs(p.x - me.x) < 340) { proj = p; break; }
  }
  var meCornered = me.x < CFG.WALL + 70 || me.x > CFG.STAGE_W - CFG.WALL - 70;
  var foeCornered = foe.x < CFG.WALL + 110 || foe.x > CFG.STAGE_W - CFG.WALL - 110;

  if (me.meter >= CFG.MAX_METER && d < 320 && roll < P.superUse && (foe.state !== 'jump')) {
    this.plan = { type: 'super', timer: 8 };
  } else if (proj && Math.abs(proj.x - me.x) < 240 && roll < 0.75) {
    this.plan = Math.random() < 0.6 ? { type: 'jumpproj', timer: 6 } : { type: 'block', timer: 24 };
  } else if (foeStartup && d < 250 && roll < P.block) {
    this.plan = { type: 'block', timer: rndi(16, 28) };
  } else if (foe.state === 'jump' && d < 230 && roll < P.antiAir) {
    this.plan = { type: 'antiair', timer: 10 };
  } else if (foeRecovery && d < 210 && roll < 0.8) {
    this.plan = { type: 'punish', timer: 8 };
  } else if (this.foeBlockFrames > 80 && d < THROW_RANGE && roll < P.throwUse + 0.3) {
    this.plan = { type: 'throw', timer: 6 };
  } else if (d > 460) {
    if (roll < P.specialUse * 0.45) this.plan = { type: 'sp1', timer: 34 };
    else if (roll < 0.9) this.plan = { type: 'approach', timer: rndi(22, 46) };
    else this.plan = { type: 'wait', timer: rndi(8, 18) };
  } else if (d > 235) {
    if (roll < P.aggr) this.plan = { type: 'approach', timer: rndi(14, 30) };
    else if (roll < P.aggr + 0.2) this.plan = { type: 'sp1', timer: 30 };
    else this.plan = { type: 'wait', timer: rndi(8, 16) };
  } else {
    if (roll < P.err) this.plan = { type: 'wait', timer: rndi(10, 24) };
    else if (roll < P.aggr + P.err) { this.plan = { type: 'combo', timer: 60 }; this.scriptT = 0; }
    else if (roll < P.aggr + P.err + 0.18) this.plan = { type: 'block', timer: rndi(12, 26) };
    else if (meCornered) this.plan = { type: 'escape', timer: 8 };
    else this.plan = { type: 'retreat', timer: rndi(10, 20) };
  }
  if (foeCornered && this.plan.type === 'retreat') { this.plan = { type: 'combo', timer: 50 }; this.scriptT = 0; }
};

AIController.prototype.runScript = function (world, me, foe, pad) {
  var P = AI_PARAMS[this.diff];
  var script = P.script;
  var t = this.scriptT;
  this.scriptT++;
  var dir = sign(foe.x - me.x) || 1;
  var d = Math.abs(foe.x - me.x);
  if (d > 150) {
    pad[dir > 0 ? 'right' : 'left'] = 1;
    return;
  }
  if (t < script.length) {
    var step = script[t];
    if (step === 'lp') pad.lp = 1;
    else if (step === 'lk') pad.lk = 1;
    else if (step === 'hp') pad.hp = 1;
    else if (step === 'hk') pad.hk = 1;
    else if (step === 'sp1') pad.sp = 1;
    else if (step === 'sp2') { pad.sp = 1; pad[dir > 0 ? 'right' : 'left'] = 1; }
  }
  // abort if far, hurt or foe jumped away
  if (this.scriptT > script.length + 26 || me.state === 'hitstun' || Math.abs(me.x - foe.x) > 300) {
    this.plan = { type: 'wait', timer: 8 };
    this.scriptT = 0;
  }
};

AIController.prototype.exec = function (world, me, foe, pad) {
  var dir = sign(foe.x - me.x) || 1;
  var fwdKey = dir > 0 ? 'right' : 'left';
  var backKey = dir > 0 ? 'left' : 'right';
  switch (this.plan.type) {
    case 'approach':
      if (Math.abs(me.x - foe.x) > 120) pad[fwdKey] = 1;
      break;
    case 'retreat':
      if (me.x > CFG.WALL + 80 && me.x < CFG.STAGE_W - CFG.WALL - 80) pad[backKey] = 1;
      else pad[fwdKey] = 1;
      break;
    case 'escape':
      pad.up = 1; pad[fwdKey] = 1;
      break;
    case 'block':
      pad[backKey] = 1;
      if (Math.random() < 0.3) pad.down = 1;
      break;
    case 'jumpproj':
      pad.up = 1; pad[fwdKey] = 1;
      break;
    case 'antiair':
      if (AI_PARAMS[this.diff].antiAir > 0.6) { pad.down = 1; pad.sp = 1; }
      else pad.hp = 1;
      break;
    case 'punish':
      pad.hp = 1;
      break;
    case 'throw':
      pad.lp = 1; pad.lk = 1;
      break;
    case 'sp1':
      pad.sp = 1;
      break;
    case 'super':
      pad.sup = 1;
      break;
    case 'wait':
    default:
      break;
  }
};

   SECTION: CAMERA

var Camera = {
  shakeX: 0, shakeY: 0,
  update: function (world) {
    var a = world.fighters[0], b = world.fighters[1];
    if (!a || !b) return;
    var mid = (a.x + b.x) / 2;
    var d = Math.abs(a.x - b.x);
    var targetZoom;
    if (world.cineTimer > 0 && world.cineFighter) {
      mid = world.cineFighter.x;
      targetZoom = 1.45;
    } else if (world.phase === 'ko') {
      targetZoom = 1.3;
    } else {
      targetZoom = clamp(1.24 - d / 1500, CFG.CAM_MIN, CFG.CAM_MAX);
    }
    world.camZoom += (targetZoom - world.camZoom) * 0.08;
    var viewW = CFG.W / world.camZoom;
    var minX = viewW / 2, maxX = CFG.STAGE_W - viewW / 2;
    if (minX > maxX) minX = maxX = CFG.STAGE_W / 2;
    var targetX = clamp(mid, minX, maxX);
    world.camX += (targetX - world.camX) * 0.12;
    if (world.shake > 0.3) {
      world.shake *= 0.85;
      this.shakeX = rnd(-world.shake, world.shake);
      this.shakeY = rnd(-world.shake, world.shake);
    } else {
      world.shake = 0; this.shakeX = 0; this.shakeY = 0;
    }
  },
  camY: function (zoom) { return CFG.FLOOR - (CFG.H * 0.5 - 80) / zoom; }
};

      }
    }

};

function mixWhite(hex, t) {
  if (t <= 0) return hex;
  var r, g, b;
  if (hex.charAt(0) === 'r') {
    var mm = hex.match(/\d+/g);
    r = +mm[0]; g = +mm[1]; b = +mm[2];
  } else {
    r = parseInt(hex.substr(1, 2), 16); g = parseInt(hex.substr(3, 2), 16); b = parseInt(hex.substr(5, 2), 16);
  }
  r = Math.round(r + (255 - r) * t); g = Math.round(g + (255 - g) * t); b = Math.round(b + (255 - b) * t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

        ctx.strokeStyle = '#ffc84a'; ctx.lineWidth = 6 * lt + 2;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.25, 0, 0, 6.283); ctx.stroke();
        break;
      case 'text':
        ctx.globalAlpha = Math.min(1, lt * 2);
        outlinedText(ctx, p.text, p.x, p.y, p.size, p.color, 'center', 4);
        break;
    }
  }
  ctx.globalAlpha = 1;
}

/* ---- HUD ---- */
function slantBarPath(ctx, x, y, w, h, fromLeft) {
  var sk = 14;
  ctx.beginPath();
  if (fromLeft) {
    ctx.moveTo(x + sk, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w - sk, y + h); ctx.lineTo(x, y + h);
  } else {
    ctx.moveTo(x, y); ctx.lineTo(x + w - sk, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x + sk, y + h);
  }
  ctx.closePath();
}

function drawHUD(ctx, world) {
  var a = world.fighters[0], b = world.fighters[1];
  if (!a || !b) return;
  var bw = 470, bh = 30, y = 34;
  // P1 bar: fills from centre outwards (anchor at right/centre side)
  drawHealthBar(ctx, 60, y, bw, bh, a, false);
  drawHealthBar(ctx, CFG.W - 60 - bw, y, bw, bh, b, true);
  // names
  outlinedText(ctx, T(a.char.key), 74, y + 46, 20, '#dfe6ff', 'left', 3);
  outlinedText(ctx, T(b.char.key), CFG.W - 74, y + 46, 20, '#dfe6ff', 'right', 3);
  // round icons
  for (var i = 0; i < CFG.ROUNDS_TO_WIN; i++) {
    drawRoundIcon(ctx, 586 - i * 30, y + 44, i < a.roundWins, '#29d8e5');
    drawRoundIcon(ctx, CFG.W - 586 + i * 30, y + 44, i < b.roundWins, '#ff8c42');
  }
  // timer
  var secs = Math.ceil(world.timer / 60);
  var tScale = 1;
  if (secs <= 10) tScale = 1 + 0.12 * Math.sin(world.frame * 0.25);
  var tCol = secs <= 10 ? '#ff5a5a' : '#ffffff';
  ctx.save();
  ctx.translate(CFG.W / 2, 74);
  ctx.scale(tScale, tScale);
  outlinedText(ctx, '' + secs, 0, 0, 58, tCol, 'center', 7);
  ctx.restore();
  // meters
  drawMeter(ctx, 60, CFG.H - 44, 380, 15, a.meter / CFG.MAX_METER, false, world);
  drawMeter(ctx, CFG.W - 60 - 380, CFG.H - 44, 380, 15, b.meter / CFG.MAX_METER, true, world);
  // combo counters
  drawCombo(ctx, world, a, b, true);
  drawCombo(ctx, world, b, a, false);
  // pause button (touch)
  uiPauseButton(ctx);
}

function drawHealthBar(ctx, x, y, w, h, f, mirror) {
  var frac = clamp(f.hp / CFG.MAX_HP, 0, 1);
  var ghost = clamp(f.ghostHp / CFG.MAX_HP, 0, 1);
  // frame
  ctx.fillStyle = 'rgba(8,12,28,0.75)';
  slantBarPath(ctx, x - 4, y - 4, w + 8, h + 8, !mirror); ctx.fill();
  ctx.fillStyle = '#0a0f22';
  slantBarPath(ctx, x, y, w, h, !mirror); ctx.fill();
  // ghost
  var gw = w * ghost;
  ctx.save();
  slantBarPath(ctx, x, y, w, h, !mirror); ctx.clip();
  ctx.fillStyle = 'rgba(255,120,120,0.55)';
  if (mirror) ctx.fillRect(x + w - gw, y, gw, h); else ctx.fillRect(x, y, gw, h);
  // health
  var hw = w * frac;
  var hg = ctx.createLinearGradient(x, y, x, y + h);
  hg.addColorStop(0, '#ffe36e'); hg.addColorStop(0.5, '#ffcc33'); hg.addColorStop(1, '#e8942a');
  ctx.fillStyle = hg;
  if (mirror) ctx.fillRect(x + w - hw, y, hw, h); else ctx.fillRect(x, y, hw, h);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x, y + 3, w, 5);
  ctx.restore();
}

function drawRoundIcon(ctx, x, y, won, color) {
  ctx.beginPath();
  for (var i = 0; i < 6; i++) {
    var a2 = i * Math.PI / 3 - Math.PI / 2;
    var px = x + Math.cos(a2) * 9, py = y + Math.sin(a2) * 9;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (won) { ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
  else { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawMeter(ctx, x, y, w, h, frac, mirror, world) {
  ctx.fillStyle = 'rgba(8,12,28,0.75)';
  ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  ctx.fillStyle = '#0a0f22';
  ctx.fillRect(x, y, w, h);
  var fw = w * clamp(frac, 0, 1);
  var full = frac >= 1;
  var g = ctx.createLinearGradient(x, y, x + w, y);
  if (full) {
    var pulse = 0.6 + 0.4 * Math.sin(world.frame * 0.2);
    g.addColorStop(0, '#ffc84a'); g.addColorStop(1, mixWhite('#ffe98a', pulse));
  } else {
    g.addColorStop(0, '#1f8fa0'); g.addColorStop(1, '#37e0ef');
  }
  ctx.fillStyle = g;
  if (mirror) ctx.fillRect(x + w - fw, y, fw, h); else ctx.fillRect(x, y, fw, h);
  if (full) {
    ctx.strokeStyle = 'rgba(255,220,120,' + (0.5 + 0.5 * Math.sin(world.frame * 0.2)).toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    outlinedText(ctx, T('meterFull'), mirror ? x + w / 2 : x + w / 2, y - 16, 17, '#ffd76e', 'center', 3);
  }
}

function drawCombo(ctx, world, atk, def, rightSide) {
  if (atk.comboHits < 2 || atk.comboTimer <= 0) return;
  var pop = clamp(atk.comboTimer / 12, 0, 1);
  var x = rightSide ? CFG.W - 200 : 200;
  var y = 210 - pop * 8;
  ctx.save();
  ctx.translate(x, y);
  var s = 1 + (1 - pop) * 0.25;
  ctx.scale(s, s);
  outlinedText(ctx, Tf('hits', { n: atk.comboHits }), 0, 0, 40, '#ffd34d', 'center', 6);
  ctx.restore();
}

function uiPauseButton(ctx) {
  UI.button(CFG.W - 66, 108, 52, 44, '❚❚', function () { pauseGame(); }, { small: true, id: 'pauseBtn' });
}

function drawDebug(ctx, world) {
  for (var i = 0; i < 2; i++) {
    var f = world.fighters[i];
    var ub = f.hurtbox(_ub);
    ctx.strokeStyle = '#3a7bff'; ctx.lineWidth = 2;
    ctx.strokeRect(ub.x, ub.y, ub.w, ub.h);
    var hb = f.hitbox(_hb);
    if (hb) {
      ctx.fillStyle = 'rgba(255,60,60,0.4)';
      ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
      ctx.strokeStyle = '#ff3c3c';
      ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
    }
  }
  for (var p = 0; p < world.projectiles.length; p++) {
    var pr = world.projectiles[p];
    ctx.strokeStyle = '#ff3c3c';
    ctx.strokeRect(pr.x - pr.w / 2, pr.y - pr.h / 2, pr.w, pr.h);
  }
}

var UI = {
  buttons: [], glow: {},
  reset: function () { this.buttons.length = 0; },
  button: function (x, y, w, h, label, cb, opts) {
    opts = opts || {};
    var ctx = View.ctx;
    var id = opts.id || label;
    var g = this.glow[id] || 0;
    var r = 12;
    ctx.save();
    var grd = ctx.createLinearGradient(x, y, x, y + h);
    grd.addColorStop(0, g > 0 ? '#3d4a80' : '#232a4e');
    grd.addColorStop(1, g > 0 ? '#2a3468' : '#141a38');
    ctx.fillStyle = grd;
    ctx.strokeStyle = opts.accent || '#4d5c9e';
    ctx.lineWidth = 2.5;
    roundRect(ctx, x, y, w, h, r); ctx.fill(); ctx.stroke();
    if (g > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (g / 16).toFixed(2) + ')'; roundRect(ctx, x, y, w, h, r); ctx.fill(); }
    ctx.fillStyle = '#f2f5ff';

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    ctx.restore();
    this.buttons.push({ x: x, y: y, w: w, h: h, cb: cb, id: id });
  },
  pointer: function (lx, ly) {
    for (var i = this.buttons.length - 1; i >= 0; i--) {
      var b = this.buttons[i];
      if (lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h) {
        this.glow[b.id] = 10;
        Audio2.sfx('click');
        b.cb();
        return true;
      }
    }
    return false;
  },
  decay: function () {
    for (var k in this.glow) { this.glow[k]--; if (this.glow[k] <= 0) delete this.glow[k]; }
    for (var b = 0; b < Touch.buttons.length; b++) if (Touch.buttons[b].glow > 0) Touch.buttons[b].glow--;
    if (Touch.superBtn && Touch.superBtn.glow > 0) Touch.superBtn.glow--;
  }
};

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lineH, size, color) {
  setFont(ctx, size);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  var words = text.split(' '), line = '';
  ctx.fillStyle = color;
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y);
      y += lineH; line = words[i];
    } else line = test;
  }
  if (line) { ctx.fillText(line, x, y); y += lineH; }
  return y;
}

function dimBg(ctx, a) {

  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(2,3,12,0.55)');

function drawSelectCard(ctx, i, x, y, w, h) {
  var charId = CHAR_ORDER[i];
  var ch = CHARACTERS[charId];
  var active = Game.selectPicker === i && !Game.selectDone[Game.selectPicker];
  var chosen = (Game.selectMode === '2p' && Game.selectDone[0] && Game.selectIdx[0] === i);
  ctx.save();
  ctx.fillStyle = 'rgba(10,14,32,0.88)';
  roundRect(ctx, x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = active ? (Game.selectPicker === 0 ? '#37e0ef' : '#ff8c42') : (chosen ? '#ffd34d' : '#3a4470');
  ctx.lineWidth = active ? 5 : 2.5;
  if (active) { ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 18; }
  roundRect(ctx, x, y, w, h, 18); ctx.stroke();
  ctx.shadowBlur = 0;
  var pf = null;
  for (var p = 0; p < Game.preview.length; p++) if (Game.preview[p].charId === charId) pf = Game.preview[p];
  if (pf) {
    pf.px = pf.x = x + w / 2; pf.py = pf.y = y + h - 74;
    pf.anim.set('idle');
    pf.noShadow = true;
    ctx.save();
    ctx.translate(pf.x, pf.y); ctx.scale(1.05, 1.05); ctx.translate(-pf.x, -pf.y);
    drawFighter(ctx, pf, 0, world);
    ctx.restore();
    pf.noShadow = false;

  outlinedText(ctx, T(ch.key), x + w / 2, y + 34, 26, '#ffffff', 'center', 5);

}

function selectPointer(lx, ly) {
  var cards = [{ x: 150, y: 150, w: 380, h: 430 }, { x: CFG.W - 530, y: 150, w: 380, h: 430 }];
  for (var i = 0; i < 2; i++) {
    var c = cards[i];
    if (lx >= c.x && lx <= c.x + c.w && ly >= c.y && ly <= c.y + c.h) { confirmSelect(i); return; }

function confirmSelect(i) {
  Game.selectIdx[Game.selectPicker] = i;
  Game.selectDone[Game.selectPicker] = true;
  if (Game.selectPicker === 0 && Game.selectMode === '2p') {
    Game.selectPicker = 1;
    return;
  }
  var c1 = CHAR_ORDER[Game.selectIdx[0]];
  var c2 = Game.selectMode === '2p' ? CHAR_ORDER[Game.selectIdx[1]] : (c1 === 'rhea' ? 'brann' : 'rhea');
  launchMatch(c1, c2, Game.selectMode, Game.selectDiff || 1);
}

function selectKey(code) {
  var cur = Game.selectIdx[Game.selectPicker];
  if (code === 'KeyA' || code === 'ArrowLeft') { Game.selectIdx[Game.selectPicker] = (cur + 1) % 2; Audio2.sfx('click'); }
  else if (code === 'KeyD' || code === 'ArrowRight') { Game.selectIdx[Game.selectPicker] = (cur + 1) % 2; Audio2.sfx('click'); }
  else if (code === 'KeyJ' || code === 'Enter' || code === 'Space') confirmSelect(Game.selectIdx[Game.selectPicker]);
}

function drawTouchControls(ctx) {
  var d = Touch.dpad;
  var tp = Input.touchPads || {};
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#0c1226';
  ctx.strokeStyle = '#6a7ac0'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(d.cx, d.cy, d.r, 0, 6.283); ctx.fill(); ctx.stroke();
  var dirs = [
    { k: 'left', a: Math.PI, hx: -1, hy: 0 },
    { k: 'right', a: 0, hx: 1, hy: 0 },
    { k: 'up', a: -Math.PI / 2, hx: 0, hy: -1 },
    { k: 'down', a: Math.PI / 2, hx: 0, hy: 1 }
  ];
  for (var i = 0; i < dirs.length; i++) {
    var dr = dirs[i];
    var on = tp[dr.k];
    ctx.fillStyle = on ? 'rgba(120,220,255,0.85)' : 'rgba(150,165,220,0.5)';
    var ax = d.cx + Math.cos(dr.a) * d.r * 0.62;
    var ay = d.cy + Math.sin(dr.a) * d.r * 0.62;
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(dr.a + Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(0, -13); ctx.lineTo(11, 9); ctx.lineTo(-11, 9); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  for (var b = 0; b < Touch.buttons.length; b++) {
    var btn = Touch.buttons[b];
    var on2 = tp[btn.key];
    ctx.fillStyle = on2 || btn.glow > 0 ? 'rgba(255,220,120,0.85)' : 'rgba(20,28,60,0.75)';
    ctx.strokeStyle = 'rgba(200,215,255,0.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    setFont(ctx, btn.r * 0.85);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(btn.label, btn.x, btn.y + 2);
    if (btn.sub) {
      setFont(ctx, 13);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(btn.sub, btn.x, btn.y - btn.r - 12);
    }
  }
  var sb = Touch.superBtn;
  var me = world.fighters[0];
  if (sb && me && me.meter >= CFG.MAX_METER) {
    var pulse = 0.6 + 0.4 * Math.sin(world.frame * 0.2);
    ctx.fillStyle = 'rgba(255,200,74,' + (0.55 + pulse * 0.3).toFixed(2) + ')';
    ctx.strokeStyle = '#ffe98a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r * (1 + pulse * 0.08), 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#241a05';
    setFont(ctx, 17);
    ctx.fillText('SUPER', sb.x, sb.y + 1);
  }
  ctx.globalAlpha = 1;
}

function drawMuteButton(ctx) {
  UI.button(CFG.W - 64, 18, 46, 40, Audio2.muted ? '\u2715\u266A' : '\u266A', function () {
    Audio2.setMuted(!Audio2.muted);
  }, { small: true, id: 'muteBtn' });
}

/* ---- fight screen ---- */
function renderFight(ctx, alpha) {
  drawStage(ctx, world, alpha);
  drawFighter(ctx, world.fighters[1], alpha, world);
  drawFighter(ctx, world.fighters[0], alpha, world);
  drawProjectiles(ctx, world);
  drawParticles(ctx, world);
  ctx.restore();
  if (world.cineTimer > 0) {
    ctx.fillStyle = 'rgba(4,5,18,' + (0.6 * world.cineTimer / 25).toFixed(3) + ')';
    ctx.fillRect(0, 0, CFG.W, CFG.H);
  }
  drawHUD(ctx, world);
  drawMessages(ctx);
  if (Game.debug) drawDebug(ctx, world);
  if (Game.paused) renderPause(ctx);
}

function drawMessages(ctx) {
  if (world.phase === 'intro') {
    if (world.phaseTimer > 45) {
      var final = world.fighters[0].roundWins === 1 && world.fighters[1].roundWins === 1;
      outlinedText(ctx, final ? T('finalRound') : Tf('roundN', { n: world.round }), CFG.W / 2, 300, 84, '#ffd34d', 'center', 12);
    } else {
      var s = 1 + 0.12 * Math.max(0, 1 - (45 - world.phaseTimer) / 8);
      ctx.save(); ctx.translate(CFG.W / 2, 300); ctx.scale(s, s);
      outlinedText(ctx, T('fight'), 0, 0, 116, '#ff5a5a', 'center', 14);
      ctx.restore();
    }
  }
  if (world.koText > 0 && (world.phase === 'ko' || world.phase === 'roundEnd')) {
    var k = Math.min(1, (130 - world.koText) / 8);
    ctx.save();
    ctx.translate(CFG.W / 2, 290);
    ctx.scale(0.5 + k * 0.62, 0.5 + k * 0.62);
    ctx.globalAlpha = clamp(world.koText / 30, 0, 1);
    outlinedText(ctx, T('ko'), 0, 0, 150, '#ff5a5a', 'center', 18);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  if (world.phase === 'roundEnd' && world.roundEndMsg) {
    outlinedText(ctx, world.roundEndMsg, CFG.W / 2, 390, 54, '#ffffff', 'center', 9);
  }
  if (world.phase === 'roundEnd' && world.perfect >= 0) {
    outlinedText(ctx, T('perfect'), CFG.W / 2, 448, 44, '#7ef2ff', 'center', 8);
  }
}

/* ---- flow ---- */
function launchMatch(c1, c2, mode, diff) {
  Game.lastSetup = { c1: c1, c2: c2, mode: mode, diff: diff };
  world = newWorld();
  world.mode = mode === '2p' ? '2p' : 'cpu';
  world.difficulty = clamp(diff, 0, 2);
  setupFighters(world, c1, c2, mode === '2p');
  world.fighters[0].ctrl = 'human';
  aiControllers[0] = null; aiControllers[1] = null;
  if (world.mode === 'cpu') {
    world.fighters[1].ctrl = 'cpu';
    aiControllers[1] = new AIController(1, world.difficulty);
  }
  Input.testPads = null;
  Game.screen = 'fight';
  Game.paused = false;
  clearBuffers();
  Music.setTrack('fight');
}

function restartMatch() {
  var s = Game.lastSetup;
  launchMatch(s.c1, s.c2, s.mode, s.diff);
}

function toMenu() {
  Game.screen = 'menu';
  Game.paused = false;
  setupDemo();
  Music.setTrack('menu');
}

function pauseGame() {
  if (Game.screen === 'fight') Game.paused = true;
}

function setupDemo() {
  world = newWorld();
  setupFighters(world, 'rhea', 'brann', false);
  world.camX = CFG.STAGE_W / 2;
  world.camZoom = 1;
  world.phase = 'demo';
}

function demoTick() {
  world.frame++;
  world.camX = CFG.STAGE_W / 2;
  world.camZoom = 1;
  for (var i = 0; i < world.fighters.length; i++) {
    var f = world.fighters[i];
    if (Game.screen !== 'result') f.anim.set('idle');
    f.px = f.x; f.py = f.y;
    f.anim.update();
    f.blink--;
    if (f.blink <= 0) { f.blinkT = 6; f.blink = rndi(90, 300); }
    if (f.blinkT > 0) f.blinkT--;
    f.updateHair();
  }
  Effects.update(world);
}

/* ============================================================
   SECTION: MAIN LOOP
   ============================================================ */
var _acc = 0, _last = 0;

function fixedStep() {
  updateInputBuffers();
  Music.tick();
  if (Game.screen === 'fight') {
    if (Touch.current && !Game.paused && View.ctx) {
      applyTouches(Touch.current, View.gameRect, View.scale);
    }
    if (!Game.paused) {
      world.update();
      if (world.matchOver) {
        Game.resultWinner = world.winner;
        Game.screen = 'result';
        Music.setTrack('menu');
        Audio2.sfx('win');
      }
    }
  } else {
    Touch.current = null;
    demoTick();
  }
  UI.decay();
}

function frame(ts) {
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  if (View.hidden || !View.ctx) { _last = ts; return; }
  if (!_last) _last = ts;
  var dt = Math.min(ts - _last, 100);
  _last = ts;
  var speed = (Game.screen === 'fight' && !Game.paused) ? world.slowmo : 1;
  _acc += dt * speed;
  var steps = 0;
  while (_acc >= 16.6667 && steps < 5) {
    fixedStep();
    _acc -= 16.6667;
    steps++;
  }
  if (steps === 5) _acc = 0;
  var alpha = clamp(_acc / 16.6667, 0, 1);
  render(alpha);
}

function render(alpha) {
  var ctx = View.ctx;
  if (!ctx) return;
  UI.reset();
  ctx.fillStyle = '#05060e';
  ctx.fillRect(0, 0, View.vw, View.vh);
  ctx.save();
  ctx.translate(View.gameRect.x, View.gameRect.y);
  ctx.scale(View.scale, View.scale);
  ctx.beginPath(); ctx.rect(0, 0, CFG.W, CFG.H); ctx.clip();
  switch (Game.screen) {
    case 'title': renderTitle(ctx, alpha); break;
    case 'menu': renderMenu(ctx); break;
    case 'difficulty': renderDifficulty(ctx); break;
    case 'select': renderSelect(ctx); break;
    case 'help': renderHelp(ctx); break;
    case 'fight': renderFight(ctx, alpha); break;
    case 'result': renderResult(ctx, alpha); break;
    default: renderTitle(ctx, alpha);
  }
  if (Game.screen !== 'fight') drawMuteButton(ctx);
  ctx.restore();
  if (Game.screen === 'fight' && !Game.paused && Touch.everTouched) {
    ctx.save();
    ctx.translate(View.gameRect.x, View.gameRect.y);
    ctx.scale(View.scale, View.scale);
    drawTouchControls(ctx);
    ctx.restore();
    ctx.save();
    ctx.translate(View.gameRect.x, View.gameRect.y);
    ctx.scale(View.scale, View.scale);
    drawMuteButton(ctx);
    ctx.restore();
  }
}

function resize() {
  if (!View.canvas) return;
  var w = window.innerWidth, h = window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, CFG.DPR_CAP);
  View.canvas.width = Math.round(w * dpr);
  View.canvas.height = Math.round(h * dpr);
  View.canvas.style.width = w + 'px';
  View.canvas.style.height = h + 'px';
  View.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  View.vw = w; View.vh = h;
  View.portrait = h > w * 1.02;
  var s = View.portrait ? w / CFG.W : Math.min(w / CFG.W, h / CFG.H);
  View.scale = s;
  if (View.portrait) {
    View.gameRect = { x: 0, y: 0, w: CFG.W * s, h: CFG.H * s };
  } else {
    View.gameRect = { x: (w - CFG.W * s) / 2, y: (h - CFG.H * s) / 2, w: CFG.W * s, h: CFG.H * s };
  }
  buildTouchLayout(View.vw, View.vh, View.gameRect, View.portrait);
}

/* ---- events ---- */
function initAudio() {
  Audio2.init();
  Audio2.resume();
  if (Audio2.ready && !Music.track) Music.setTrack(Game.screen === 'fight' ? 'fight' : 'menu');
}

function onPointerDown(e) {
  initAudio();
  var lx = (e.clientX - View.gameRect.x) / View.scale;
  var ly = (e.clientY - View.gameRect.y) / View.scale;
  if (Game.screen === 'title') {
    if (!Sprites.ready()) return;
    Game.screen = 'menu';
    Music.setTrack('menu');
    Audio2.sfx('click');
    return;
  }
  if (UI.pointer(lx, ly)) return;
  if (Game.screen === 'select') selectPointer(lx, ly);
}

function onTouch(e) {
  if (e.cancelable) e.preventDefault();
  initAudio();
  Touch.everTouched = true;
  Touch.current = e.touches;
}

function onKeyDown(e) {
  initAudio();
  if (e.code === 'F2' || e.code === 'Backquote') {
    Game.debug = !Game.debug;
    e.preventDefault();
    return;
  }
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (Game.screen === 'fight') Game.paused = !Game.paused;
    else if (Game.screen !== 'title') Game.screen = 'menu';
    return;
  }
  if (Game.screen === 'title') {
    if (!Sprites.ready()) return;
    Game.screen = 'menu';
    Music.setTrack('menu');
    return;
  }
  if (Game.screen === 'select') { selectKey(e.code); return; }
  Input.keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
}

function onKeyUp(e) { Input.keys[e.code] = false; }

function init() {
  var canvas = document.getElementById('game');
  if (!canvas) return;
  View.canvas = canvas;
  View.ctx = canvas.getContext('2d', { alpha: false });
  Stage.build();
  Sprites.load();
  Effects.initAmbient();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 80); });
  document.addEventListener('visibilitychange', function () {
    View.hidden = document.hidden;
    if (document.hidden && Game.screen === 'fight' && !Game.paused) Game.paused = true;
  });
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('touchstart', onTouch, { passive: false });
  canvas.addEventListener('touchmove', onTouch, { passive: false });
  canvas.addEventListener('touchend', onTouch, { passive: false });
  canvas.addEventListener('touchcancel', onTouch, { passive: false });
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', function () { Input.keys = {}; });
  resize();
  setupDemo();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  else frame(0);
}

/* ============================================================
   SECTION: TEST HOOKS
   ============================================================ */
function apiGetState() {
  return {
    frame: world.frame,
    screen: Game.screen,
    phase: world.phase,
    round: world.round,
    timer: world.timer,
    mode: world.mode,
    difficulty: world.difficulty,
    matchOver: world.matchOver,
    winner: world.winner,
    fighters: [
      { x: world.fighters[0].x, y: world.fighters[0].y, hp: world.fighters[0].hp, meter: world.fighters[0].meter, state: world.fighters[0].state, roundWins: world.fighters[0].roundWins, facing: world.fighters[0].facing, comboHits: world.fighters[0].comboHits },
      { x: world.fighters[1].x, y: world.fighters[1].y, hp: world.fighters[1].hp, meter: world.fighters[1].meter, state: world.fighters[1].state, roundWins: world.fighters[1].roundWins, facing: world.fighters[1].facing, comboHits: world.fighters[1].comboHits }
    ]
  };
}

function apiStartMatch(p1, p2, mode, difficulty) {
  var c1 = CHARACTERS[p1] ? p1 : 'rhea';
  var c2 = CHARACTERS[p2] ? p2 : 'brann';
  launchMatch(c1, c2, mode === '2p' ? '2p' : 'cpu', clamp(difficulty, 0, 2));
  return apiGetState();
}

function apiPress(player, button, down) {
  if (!Input.testPads) Input.testPads = [makePad(), makePad()];
  var p = Input.testPads[clamp(player, 0, 1)];
  if (button in p) p[button] = down ? 1 : 0;
}

function apiStep(n) {
  n = clamp(n || 1, 1, 7200);
  for (var i = 0; i < n; i++) fixedStep();
  return apiGetState();
}

function apiSetDifficulty(n) {
  world.difficulty = clamp(n, 0, 2);
  if (aiControllers[1]) aiControllers[1].diff = world.difficulty;
  if (aiControllers[0]) aiControllers[0].diff = world.difficulty;
}

function apiDebug(on) { Game.debug = !!on; }

function apiAddMeter(player, amount) {
  var f = world.fighters[clamp(player, 0, 1)];
  if (f) f.meter = clamp(f.meter + amount, 0, CFG.MAX_METER);
}

function validateMoves() {
  var errors = [], count = 0;
  for (var id in MOVES) {
    var m = MOVES[id];
    count++;
    function bad(cond, msg) { if (cond) errors.push(id + ': ' + msg); }
    bad(typeof m.startup !== 'number' || m.startup < 1 || !isFinite(m.startup), 'bad startup');
    bad(typeof m.active !== 'number' || m.active < 1 || !isFinite(m.active), 'bad active');
    bad(typeof m.recovery !== 'number' || m.recovery < 0 || !isFinite(m.recovery), 'bad recovery');
    bad(typeof m.damage !== 'number' || m.damage <= 0 || m.damage > 100, 'bad damage');
    bad(m.hitstun < 0 || m.blockstun < 0, 'bad stun');
    bad(!m.box || [m.box.x, m.box.y, m.box.w, m.box.h].some(function (v) { return typeof v !== 'number' || !isFinite(v); }), 'bad box');
    bad(moveTotal(m) > 130, 'move too long');
    if (m.multi) bad(m.multi.hits < 1 || m.multi.interval < 1, 'bad multi');
  }
  return { count: count, errors: errors };
}

function apiSelfTest() {
  var summary = { matches: 0, moveErrors: [], failures: [], framesSimulated: 0, passed: false };
  var mv = validateMoves();
  summary.movesChecked = mv.count;
  summary.moveErrors = mv.errors;

  var wasScreen = Game.screen;
  var mashSets = [0, 5, 10, 15];
  for (var i = 0; i < 20; i++) {
    var c1 = CHAR_ORDER[rndi(0, 1)], c2 = CHAR_ORDER[rndi(0, 1)];
    launchMatch(c1, c2, 'cpu', i % 3);
    world.fighters[0].ctrl = 'cpu';
    aiControllers[0] = new AIController(0, i % 3);
    var mash = mashSets.indexOf(i) >= 0;
    var guard = 0, maxGuard = 60 * 60 * 4;
    while (!world.matchOver && guard < maxGuard) {
      if (mash) {
        if (Math.random() < 0.12) apiPress(0, ['lp', 'lk', 'hp', 'hk', 'sp', 'sup', 'left', 'right', 'up', 'down'][rndi(0, 9)], true);
        if (Math.random() < 0.3) apiPress(0, ['lp', 'lk', 'hp', 'hk', 'sp', 'sup'][rndi(0, 5)], false);
      }
      fixedStep();
      guard++;
      summary.framesSimulated++;
      if (guard % 60 === 0) {
        for (var f = 0; f < 2; f++) {
          var ft = world.fighters[f];
          if (!isFinite(ft.x) || !isFinite(ft.y)) summary.failures.push('match ' + i + ': NaN position');
          if (ft.hp < 0 || ft.hp > CFG.MAX_HP) summary.failures.push('match ' + i + ': hp out of range: ' + ft.hp);
          if (ft.meter < 0 || ft.meter > CFG.MAX_METER) summary.failures.push('match ' + i + ': meter out of range: ' + ft.meter);
        }
        if (!isFinite(world.timer)) summary.failures.push('match ' + i + ': NaN timer');
      }
    }
    if (!world.matchOver) {
      summary.failures.push('match ' + i + ': stuck (no winner after ' + guard + ' frames)');
    } else {
      summary.matches++;
      if (world.winner < 0) summary.failures.push('match ' + i + ': ended without winner');
    }
  }
  Input.testPads = null;
  Game.screen = wasScreen;
  summary.passed = summary.failures.length === 0 && summary.moveErrors.length === 0;
  return summary;
}

function apiShowScreen(name) {
  if (['title', 'menu', 'difficulty', 'select', 'help', 'result'].indexOf(name) >= 0) {
    if (name === 'result') { Game.resultWinner = world.winner >= 0 ? world.winner : 0; }
    Game.screen = name;
  }
}
function apiSetPaused(v) { if (Game.screen === 'fight') Game.paused = !!v; }
function apiSimulateTouch(list) { Touch.current = list; Touch.everTouched = true; }
function apiResize() { resize(); }

var __fighter = {
  getState: apiGetState,
  startMatch: apiStartMatch,
  press: apiPress,
  step: apiStep,
  setDifficulty: apiSetDifficulty,
  debug: apiDebug,
  addMeter: apiAddMeter,
  selfTest: apiSelfTest,
  showScreen: apiShowScreen,
  setPaused: apiSetPaused,
  simulateTouch: apiSimulateTouch,
  resize: apiResize
};
__fighter.sprite = function (i) { var f = world.fighters[i]; return [f.anim.name, f.anim.t, f.state, spriteName(f)]; };
if (typeof window !== 'undefined') window.__fighter = __fighter;

/* ---- boot ---- */
buildAnims();
Effects.initAmbient();
if (typeof document !== 'undefined' && document.getElementById) {
  init();
}

})();

</script>
</body>
